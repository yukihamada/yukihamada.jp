<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ギターコード集 | yukihamada.jp/chords</title>
<meta name="description" content="Shiopixel / 濱田優貴の曲のギターコード譜集。カポ切替・自動スクロール対応。">
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#0e0d0b; --fg:#f4f1ea; --mut:#9b968a; --line:rgba(244,241,234,.12);
    --gold:#d9b26a; --chip:rgba(217,178,106,.1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
  .wrap{max-width:560px;margin:0 auto;padding:36px 20px 80px}
  a.back{color:var(--mut);font-size:12px;text-decoration:none}
  a.back:hover{color:var(--gold)}
  h1{font-size:20px;font-weight:600;margin:22px 0 4px}
  .sub{font-size:12px;color:var(--mut);margin-bottom:26px}
  .song{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:12px;
    margin-bottom:10px;text-decoration:none;color:var(--fg);background:var(--chip);
    transition:border-color .15s}
  .song:hover{border-color:var(--gold)}
  .song .title{font-size:15px;font-weight:600}
  .song .artist{font-size:12px;color:var(--mut);margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← yukihamada.jp</a>
  <h1>ギターコード集</h1>
  <div class="sub">カポ切替・自動スクロール対応。コードはAI解析(要確認)。</div>
  <div id="list"></div>
  <div style="margin-top:22px;font-size:12px">
    <a href="/chords/ed.html" style="color:var(--mut);text-decoration:none">🔒 コード進行帳 private — Ed Sheeran・尾崎豊・Mr.Children・back number</a>
  </div>
</div>
<script>
const SONGS = [
  {slug:"musubinaosu-asa", title:"結び直す朝", artist:"Shiopixel"},
  {slug:"triangle", title:"三角の歌 (Triangle Song)", artist:"濱田優貴"},
  {slug:"attention-kudasai", title:"アテンションください", artist:"Shiopixel"},
  {slug:"sore-koi-jujutsu", title:"それ恋じゃなくて、柔術", artist:"Shiopixel"},
];
const list = document.getElementById('list');
SONGS.forEach(s => {
  const a = document.createElement('a');
  a.className = 'song';
  a.href = `/chords/song.html?slug=${encodeURIComponent(s.slug)}`;
  a.innerHTML = `<div class="title">${s.title}</div><div class="artist">${s.artist}</div>`;
  list.appendChild(a);
});
</script>
</body>
</html>
