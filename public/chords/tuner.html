<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チューナー & メトロノーム | yukihamada.jp/chords</title>
<meta name="description" content="ブラウザだけで動くギターチューナー(クロマチック)とメトロノーム。マイク使用・インストール不要。">
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --bg:#0e0d0b; --fg:#f4f1ea; --mut:#9b968a; --line:rgba(244,241,234,.12);
    --gold:#d9b26a; --chord:#7ecbb0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
  .wrap{max-width:560px;margin:0 auto;padding:36px 20px 80px}
  a.back{color:var(--mut);font-size:12px;text-decoration:none}
  a.back:hover{color:var(--gold)}
  h1{font-size:20px;font-weight:600;margin:22px 0 4px}
  .sub{font-size:12px;color:var(--mut);margin-bottom:26px}
  .tool{border:1px solid var(--line);border-radius:12px;background:rgba(126,203,176,.06);
    margin-bottom:14px;padding:16px 18px}
  .tool h2{font-size:15px;font-weight:600;margin:0 0 10px}
  .tuner-note{font-family:"SF Mono",Menlo,monospace;font-size:44px;font-weight:700;color:var(--chord);
    text-align:center;min-height:1.2em}
  .tuner-cents{font-size:12px;color:var(--mut);text-align:center;margin-top:2px;min-height:1.2em}
  .tuner-bar{position:relative;height:6px;background:var(--line);border-radius:3px;margin:12px 8px 4px}
  .tuner-needle{position:absolute;top:-4px;width:3px;height:14px;background:var(--gold);border-radius:2px;
    left:50%;transform:translateX(-50%);transition:left .08s linear}
  .tuner-marks{display:flex;justify-content:space-between;font-size:9px;color:var(--mut);margin:0 4px}
  .tuner-strings{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .tuner-strings button{background:#1a1815;color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;font-size:13px;font-family:"SF Mono",Menlo,monospace;cursor:pointer}
  .tuner-strings button:hover{border-color:var(--gold)}
  .tuner-strings button.target{border-color:var(--chord);color:var(--chord)}
  .tool .btn{display:inline-block;background:var(--gold);color:#1a1512;border:none;border-radius:10px;
    padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;margin-top:14px}
  .tool .btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
  .metro-row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px;font-size:13px}
  .metro-row input[type=range]{width:160px;accent-color:var(--gold)}
  .metro-bpm{font-family:"SF Mono",Menlo,monospace;color:var(--gold);min-width:64px;text-align:center}
  .metro-beat{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin:0 3px;vertical-align:middle}
  .metro-beat.on{background:var(--chord)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/chords/">← コード一覧</a>
  <h1>チューナー & メトロノーム</h1>
  <div class="sub">インストール不要。マイクを許可するだけで動くギター用クロマチックチューナーとメトロノーム。</div>

  <div class="tool">
    <h2>🎸 クロマチックチューナー</h2>
    <div class="tuner-note" id="tunerNote">--</div>
    <div class="tuner-cents" id="tunerCents">マイクを許可すると開始</div>
    <div class="tuner-bar"><div class="tuner-needle" id="tunerNeedle"></div></div>
    <div class="tuner-marks"><span>-50¢</span><span>0</span><span>+50¢</span></div>
    <div class="tuner-strings" id="tunerStrings"></div>
    <div style="text-align:center">
      <button class="btn" id="tunerBtn" onclick="toggleTuner()">🎤 チューナー開始</button>
      <button class="btn ghost" id="refBtn" onclick="playRef()">♪ A=440Hz 基準音</button>
    </div>
  </div>

  <div class="tool">
    <h2>⏱ メトロノーム</h2>
    <div class="metro-row">
      <span class="metro-bpm" id="metroBpm">♩=90</span>
      <span id="metroBeats">
        <span class="metro-beat"></span><span class="metro-beat"></span><span class="metro-beat"></span><span class="metro-beat"></span>
      </span>
    </div>
    <div class="metro-row">
      <input type="range" id="metroRange" min="40" max="200" value="90" oninput="setBpm(this.value)">
    </div>
    <div style="text-align:center">
      <button class="btn" id="metroBtn" onclick="toggleMetro()">▶ 開始</button>
    </div>
  </div>
</div>
<script src="/chords/tools.js"></script>
</body>
</html>
