<!doctype html><html lang=ja><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>焚火 — ATSM</title>
<meta name=theme-color content="#0a0a0c">
<link rel=manifest href="/takibi/manifest.webmanifest">
<link rel=apple-touch-icon href="/apple-touch-icon.png">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-title content="焚火">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(180deg,#0a0a0c,#000);color:#fff;font-family:-apple-system,'Hiragino Sans',sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px 18px 14px;background:rgba(8,8,10,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,140,0,.14);z-index:5}
h1{font-size:22px;font-weight:800;letter-spacing:.04em}
.maki{font-weight:700;color:#ffae42;font-size:15px}
main{max-width:680px;margin:0 auto;padding:16px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,140,0,.18);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.au{font-weight:700;color:#ffae42;font-size:14px}.ts{font-size:11px;color:#888}
.bd{font-size:14.5px;line-height:1.75;color:rgba(255,255,255,.92);white-space:pre-wrap;word-break:break-word}
.bd a{color:#ffd07a}
.rx{display:flex;gap:16px;margin-top:11px;align-items:center}
.rb{background:none;border:none;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;gap:5px}
.rb b{font-size:12px;color:#ffae42}
.listen{background:rgba(255,140,0,.12);border:1px solid rgba(255,140,0,.4);color:#ffae42;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.listen:disabled{opacity:.5}
.st{text-align:center;color:#888;padding:40px 20px}
.btn{padding:13px;border-radius:10px;border:none;font-weight:700;font-size:15px;cursor:pointer;background:#ff8c1a;color:#000}
.note{font-size:11px;color:#777;text-align:center;margin:10px 0 0;line-height:1.6}
</style></head><body>
<header><h1>焚火 <span style="font-size:13px;color:#888;font-weight:400">ATSM</span></h1><span class=maki id=maki>🔥 0</span></header>
<main><div id=feed><div class=st>火を確認中…</div></div>
<p class=note>🔊 を押すと、その薪を<b>生成された声</b>で聞けます（Koe）。投稿は <a href="https://atsm.wtf/community" style="color:#ffd07a">atsm.wtf</a> または <a href="https://mcp.koe.live/app" style="color:#ffd07a">Koe</a> から。</p></main>
<audio id=player style="display:none"></audio>
<script>
const FEED='https://mcp.koe.live/api/takibi/feed';
const SPEAK='https://mcp.koe.live/api/takibi/speak';
const AUDIO='https://mcp.koe.live';
const $=s=>document.querySelector(s);
let maki=+(localStorage.maki||0); const rx=JSON.parse(localStorage.rx||'{}'); const cache={};
$('#maki').textContent='🔥 '+maki;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target=_blank rel=noopener>$1</a>');
async function load(){
  try{
    const r=await fetch(FEED); const j=await r.json();
    const items=(j.items||[]).filter(p=>p.text&&p.text.trim());
    if(!items.length){$('#feed').innerHTML='<div class=st>🔥 まだ薪がありません</div>';return}
    $('#feed').innerHTML=items.map(p=>{const f=rx[p.id]?.f||0,t=rx[p.id]?.t||0;
      return `<div class=card><div class=top><span class=au>${esc(p.member_name||'名無し')}</span><span class=ts>${esc((p.created_at||'').slice(5,16))}</span></div>
      <div class=bd>${linkify(p.text)}</div>
      <div class=rx>
        <button class=listen data-id="${p.id}">🔊 <span>聞く</span></button>
        <button class=rb data-id="${p.id}" data-r=f>🔥${f?'<b>'+f+'</b>':''}</button>
        <button class=rb data-id="${p.id}" data-r=t>🙏${t?'<b>'+t+'</b>':''}</button>
      </div></div>`}).join('');
  }catch(e){$('#feed').innerHTML='<div class=st>焚き火に繋がりません<br><button class=btn style="margin-top:12px;max-width:160px" onclick="load()">もう一度</button></div>'}
}
$('#feed').addEventListener('click',async e=>{
  const lb=e.target.closest('.listen');
  if(lb){const id=lb.dataset.id;lb.disabled=true;const sp=lb.querySelector('span');const old=sp.textContent;sp.textContent='生成中…';
    try{let url=cache[id];
      if(!url){const r=await fetch(SPEAK,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});const j=await r.json();
        if(!j.ok||!j.url){throw new Error(j.error||'no audio')}url=AUDIO+j.url;cache[id]=url;}
      const pl=$('#player');pl.src=url;await pl.play();sp.textContent='再生中';pl.onended=()=>{sp.textContent=old;lb.disabled=false};
    }catch(err){sp.textContent='✕ '+(err.message||'失敗').slice(0,16);setTimeout(()=>{sp.textContent=old;lb.disabled=false},2500)}
    return;}
  const b=e.target.closest('.rb');if(!b)return;
  const id=b.dataset.id,r=b.dataset.r;rx[id]=rx[id]||{f:0,t:0};rx[id][r]++;localStorage.rx=JSON.stringify(rx);
  if(r==='f'){maki++;localStorage.maki=maki;$('#maki').textContent='🔥 '+maki}
  if(navigator.vibrate)navigator.vibrate(8);
  b.innerHTML=(r==='f'?'🔥':'🙏')+'<b>'+rx[id][r]+'</b>';
});
load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/takibi/sw.js').catch(()=>{});
</script></body></html>
