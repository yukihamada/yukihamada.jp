<script>
const SLIDES=[{"b": "01_title", "scene": "At dusk in a quiet Hokkaido village, people of different ages gather around a small campfire beside a wooden cabin; a laptop glows softly on a low table, its light mixing with the firelight; warm gouache, deep blue twilight + lantern orange, washi-paper border", "no": ["第一枚", "Card 1"], "alt": "夕暮れの北海道の村、小屋のそばのたき火を囲む老若。低い卓でノートPCがやわらかく光り、火と混ざる", "title": ["合宿を、始めました", "We've Started a Camp"], "ja": ["お知らせです。弟子屈・美留和で、「AI合宿」を始めました。難しい座学ではありません。手を動かして、その場で作って、夜は焚き火を囲む。AI時代を、頭でなく体で覚える数日間です。", "An announcement: we've started an 'AI Camp' in Teshikaga, Biruwa. Not heavy lectures — you move your hands, build things on the spot, and gather around a campfire at night. A few days to learn the AI era with your body, not just your head."], "kanso": ["読み上げは、いつものとおり僕の声のAIクローン。本人は焚き火の番をしています。まずは「なぜ今、合宿なのか」から。", "The narration is, as always, an AI clone of my voice — the real me is tending the fire. Let's start with 'why a camp, why now.'"], "yomi": ["お知らせです。てしかが・びるわで、「エーアイ合宿」を始めました。難しい座学ではありません。手を動かして、その場で作って、夜は焚き火を囲む。エーアイ時代を、頭でなく体で覚える数日間です。読み上げは、いつものとおり僕の声のエーアイクローン。本人は焚き火の番をしています。まずは「なぜ今、合宿なのか」から。"], "srcs": [], "audio": ["audio/01.mp3", "audio/01.mp3"]}, {"b": "02_why", "scene": "A person standing before a glowing doorway of light shaped like a terminal window; on the far side, tools and machines assemble themselves out of ribbons of light; a feeling of 'install one thing, and a whole world opens'; warm watercolor", "no": ["第二枚", "Card 2"], "alt": "端末の窓の形をした光の戸口の前に立つ人。向こう側で道具や機械が光のリボンから組み上がる", "title": ["なぜ今＝AI時代に備える", "Why Now — Get Ready for the AI Era"], "ja": ["いまは、たった一つ「エージェント」を入れるだけで、できることが一気に広がる時代になりました。Agentを入れた人と、入れていない人の差が、これから毎月ひらいていく。だから、慌てる前に、手元で動かして体に入れておく。それがこの合宿の目的です。", "We've entered an age where installing just one thing — an agent — suddenly widens what you can do. The gap between those who've installed an agent and those who haven't will widen every month from here. So before the rush, get it running in your own hands. That's the point of this camp."], "kanso": ["『いつか勉強しよう』が一番もったいない。AIは、読むより、入れて動かすほうが百倍はやく分かる。合宿は、その『最初の一回』を一緒にやる場所です。", "'I'll study it someday' is the costliest plan. With AI, installing and running it teaches you a hundred times faster than reading. The camp is where we do that 'first time' together."], "yomi": ["いまは、たった一つ「エージェント」を入れるだけで、できることが一気に広がる時代になりました。エージェントを入れた人と、入れていない人の差が、これから毎月ひらいていく。だから、慌てる前に、手元で動かして体に入れておく。それがこの合宿の目的です。『いつか勉強しよう』が一番もったいない。エーアイは、読むより、入れて動かすほうが百倍はやく分かる。合宿は、その『最初の一回』を一緒にやる場所です。"], "srcs": [], "audio": ["audio/02.mp3", "audio/02.mp3"]}, {"b": "03_do1", "scene": "Two people at a wooden table each with a laptop, friendly glowing lantern-spirits (AI agents) rising from their screens and helping build small tools and toys out of light; a mentor leans in; warm gouache", "no": ["第三枚", "Card 3"], "alt": "木の卓で二人がノートPCを開き、画面から人なつこい提灯の精霊(AIエージェント)が立ちのぼり、光の道具を一緒に作る。師匠が寄り添う", "title": ["やること①＝エージェントを入れて、何でも作る", "What You Do ① — Install an Agent, Build Anything"], "ja": ["やることはシンプル。Claude Code、または Claude Code で作った『自分専用のエージェント』をインストールして、その場で何でも作ってみる。アプリでも、自動化でも、自分の仕事の道具でも。「言ったら、できた」を、その手で体験します。", "What you do is simple: install Claude Code — or your own custom agent built with Claude Code — and build anything, right there. An app, an automation, a tool for your own job. You'll feel 'I said it, and it was done' with your own hands."], "kanso": ["僕も、自分のサービスはほとんどこのやり方で作っています。完璧に設計してから、ではなく、動かしながら直す。その『速さ』こそ、合宿で一番持って帰ってほしいものです。", "I build almost all my own services this way: not 'design perfectly first,' but 'run it and fix as you go.' That speed is the thing I most want you to take home from the camp."], "yomi": ["やることはシンプル。クロードコード、または クロードコード で作った『自分専用のエージェント』をインストールして、その場で何でも作ってみる。アプリでも、自動化でも、自分の仕事の道具でも。「言ったら、できた」を、その手で体験します。僕も、自分のサービスはほとんどこのやり方で作っています。完璧に設計してから、ではなく、動かしながら直す。その『速さ』こそ、合宿で一番持って帰ってほしいものです。"], "srcs": [], "audio": ["audio/03.mp3", "audio/03.mp3"]}, {"b": "04_do2", "scene": "A joyful evening scene: people doing gentle jiu-jitsu practice on a mat under the open sky, others soaking in a hot spring, all gathered later around a big campfire with the lake and mountains behind; warm, restful, watercolor", "no": ["第四枚", "Card 4"], "alt": "夕方の楽しい情景。青空の下のマットで柔術の稽古、温泉に浸かる人、やがて湖と山を背に大きな焚き火を囲む", "title": ["やること②＝気を使いながら、最大限楽しむ", "What You Do ② — Enjoy It Fully, Mindfully"], "ja": ["でも、詰め込みではありません。AIに気を使いながら——つまり、頼りすぎず、こちらも手を動かしながら——最大限に楽しむ。昼は柔術で体を動かし、温泉に浸かり、夜は焚き火を囲んで話す。学びと遊びは、分けないほうが深く入ります。", "But it's not a cram session. While being considerate to AI — not over-relying on it, keeping your own hands moving — you enjoy it to the fullest. Move your body with jiu-jitsu by day, soak in a hot spring, and talk around the campfire at night. Learning and play sink deeper when you don't separate them."], "kanso": ["AIに全部任せると、人は鈍る。だから『気を使う』。任せる所と、自分でやる所を、合宿で体に覚えさせる。楽しいほど、よく身につきます。", "Hand everything to AI and you go dull — so we 'stay considerate.' At camp, your body learns where to delegate and where to do it yourself. The more fun it is, the better it sticks."], "yomi": ["でも、詰め込みではありません。エーアイに気を使いながら、つまり、頼りすぎず、こちらも手を動かしながら、最大限に楽しむ。昼は柔術で体を動かし、温泉に浸かり、夜は焚き火を囲んで話す。学びと遊びは、分けないほうが深く入ります。エーアイに全部任せると、人は鈍る。だから『気を使う』。任せる所と、自分でやる所を、合宿で体に覚えさせる。楽しいほど、よく身につきます。"], "srcs": [], "audio": ["audio/04.mp3", "audio/04.mp3"]}, {"b": "05_place", "scene": "A breathtaking Hokkaido vista at golden hour: a vividly clear blue caldera lake and a wider lake with a single person on a SUP paddleboard, soft steam rising from an open-air onsen, a few cattle grazing in green pasture, a small wooden dojo and a fire pit, birch trees and distant volcanic hills; abundant nature with a sacred, still 'power-spot' calm; warm gouache, deep blue twilight + lantern orange", "no": ["第五枚", "Card 5"], "alt": "夕方の北海道の絶景。澄んだ青いカルデラ湖と、SUPに乗る人のいる湖、立ちのぼる温泉の湯気、牧草地の牛、小さな木の道場とたき火、白樺と遠い火山。神聖で静かなパワースポットの気配", "title": ["場所＝弟子屈・美留和（母艦）", "The Place — Teshikaga, Biruwa"], "ja": ["場所は、弟子屈・美留和。摩周湖と屈斜路湖、川湯の温泉、サップの似合う湖。澄んだ水、うまいご飯、牛。柔術の道場も、焚き火も、きれいなパワースポットも、ぜんぶ自然の中にあります。人口数千人台の静かな町。ここは僕らの実証フィールドの『母艦』——日本で一番『言葉がそのまま建つ』場所です。", "The place is Teshikaga, Biruwa: Lake Mashu and Lake Kussharo, the hot springs of Kawayu, a lake made for SUP. Clear water, great food, cattle. A jiu-jitsu dojo, a campfire, beautiful power spots — all of it in nature. A quiet town of a few thousand people. This is the 'mother ship' of our proving ground — the place in Japan where 'words build most directly.'"], "kanso": ["都会のホテルでもできる合宿を、わざわざここでやる理由は、『場』が人を変えるから。水がうまい土地は、頭もよく回る。湖でととのえて、道場で組んで、焚き火で話す。コーチェラの朝より、美留和の夜明けのほうが、いいものが作れます。", "We could run this in a city hotel, but we do it here on purpose — because the place changes people. Where the water is delicious, the mind runs clearer too. Reset on the lake, roll in the dojo, talk by the fire. I make better things at a Biruwa dawn than at a festival's small hours."], "yomi": ["場所は、てしかが・びるわ。ましゅうこと くっしゃろこ、かわゆの温泉、サップの似合う湖。澄んだ水、うまいご飯、牛。柔術の道場も、焚き火も、きれいなパワースポットも、ぜんぶ自然の中にあります。人口すうせんにんだいの静かな町。ここは僕らの実証フィールドの『母艦』。日本で一番『言葉がそのまま建つ』場所です。都会のホテルでもできる合宿を、わざわざここでやる理由は、『場』が人を変えるから。水がうまい土地は、頭もよく回る。湖でととのえて、道場で組んで、焚き火で話す。コーチェラの朝より、びるわの夜明けのほうが、いいものが作れます。"], "_facts": "弟子屈町=人口約6,600人(2023)。摩周湖・屈斜路湖(日本最大のカルデラ湖)・川湯温泉(源泉かけ流し)。釧路/女満別空港から車約1時間。摩周湖は『神の湖(カムイト)』。", "srcs": [], "audio": ["audio/05.mp3", "audio/05.mp3"]}, {"b": "06_when", "scene": "A calendar-like constellation of glowing lanterns floating over the lake, a few lanterns brighter than the others (candidate dates), one hand reaching up but not yet grabbing — 'reserve now, choose the date later'; warm watercolor", "no": ["第六枚", "Card 6"], "alt": "湖の上に浮かぶ提灯の暦のような星座。いくつかが明るい(候補日)。手が伸びるがまだ掴まない——『先に確保、日付は後で』", "title": ["いつ＝直近の候補から。日付は未定でもOK", "When — From the Nearest Dates. Undecided Is Fine"], "ja": ["時期は、夏の北海道がいちばん気持ちいい季節。直近だと、6月27日から29日、7月のはじめ、などが候補です。でも——日付がまだ決められなくても、大丈夫。先に『席』だけ確保して、日付は後から一緒に決められます。", "The best season is the Hokkaido summer. The nearest candidates are June 27–29, early July, and a few more. But — even if you can't fix a date yet, that's fine. Reserve your 'seat' first, and we'll choose the date together later."], "kanso": ["『予定が合ったら行く』は、だいたい行けません。逆です。先に席を取ると、予定のほうが、合いにいきます。", "'I'll go if my schedule lines up' usually means you won't. It's the other way around: grab the seat first, and your schedule starts lining itself up."], "yomi": ["時期は、夏の北海道がいちばん気持ちいい季節。直近だと、ろくがつ にじゅうしちにち から にじゅうくにち、しちがつのはじめ、などが候補です。でも、日付がまだ決められなくても、大丈夫。先に『席』だけ確保して、日付は後から一緒に決められます。『予定が合ったら行く』は、だいたい行けません。逆です。先に席を取ると、予定のほうが、合いにいきます。"], "srcs": [], "audio": ["audio/06.mp3", "audio/06.mp3"]}, {"b": "07_price", "scene": "A simple wooden ticket-stub shaped like a folded T-shirt glowing warmly on a table, with smaller separate tokens beside it (a bed, a bowl, a book) to suggest 'lodging, meals, training are separate'; warm watercolor", "no": ["第七枚", "Card 7"], "alt": "卓上にTシャツを畳んだ形の木の半券があたたかく光る。傍らに小さな別トークン(寝床・器・本)で『宿泊・食事・研修は別』を示す", "title": ["いくら＝席は参加T。あとは別建て", "Price — The Seat Is a Tee; the Rest Is Separate"], "ja": ["お金の話も正直に。『席』は、参加Tシャツ＝10万円。これを買うと席が確保されます(日付未定でOK)。宿泊費・食事・研修費は、別。とくに研修費は、個人か法人か、役職や会社の規模で大きく変えます。法人の本気の研修は、相応の値段です。", "Money, honestly. The 'seat' is the participation tee — ¥100,000. Buy it and your seat is reserved (date can stay undecided). Lodging, meals and training fees are separate. Training in particular varies a lot by individual vs. corporate, by role and company size. A serious corporate program is priced accordingly."], "kanso": ["安くして大勢、ではなく、本気の人と深く。Tを着て焚き火を囲む頃には、10万円は『安かった』と思ってほしい。そう言えるものを、用意します。", "Not 'cheap and crowded,' but 'serious people, deep work.' By the time you're wearing the tee around the fire, I want ¥100,000 to feel like a bargain. I'll prepare something worthy of that."], "yomi": ["お金の話も正直に。『席』は、参加ティーシャツ、じゅうまんえん。これを買うと席が確保されます。日付みていでオーケー。宿泊費・食事・研修費は、別。とくに研修費は、個人か法人か、役職や会社の規模で大きく変えます。法人の本気の研修は、相応の値段です。安くして大勢、ではなく、本気の人と深く。ティーを着て焚き火を囲む頃には、じゅうまんえんは『安かった』と思ってほしい。そう言えるものを、用意します。"], "srcs": [{"t": "▶ 席を確保する（参加T・MU）", "u": "https://yukihamada.jp/seki"}], "audio": ["audio/07.mp3", "audio/07.mp3"]}, {"b": "08_end", "scene": "Night by the campfire: a folded tee with a glowing campfire-robot badge resting on a log, people's silhouettes warm around the fire, the lake reflecting stars that form faint circuit constellations; one person looks toward the viewer, inviting; warm watercolor", "no": ["第八枚", "Card 8"], "alt": "夜の焚き火。丸太の上に、焚き火ロボの紋章が光る畳んだTシャツ。火を囲む人影、湖に映る回路の星座。一人がこちらへ誘うように見る", "title": ["おしまい——席を、先に確保しよう", "The End — Reserve Your Seat First"], "ja": ["AIは、入れて、動かして、初めて自分のものになります。弟子屈・美留和で、一緒にその最初の一回を。難しく考えず、まずは席だけ、先に確保してください。日付は、それから一緒に決めましょう。火は、もう点いています。", "AI only becomes yours once you install it and run it. Let's do that first time together, in Teshikaga, Biruwa. Don't overthink it — just reserve your seat first. We'll choose the date together after that. The fire is already lit."], "kanso": ["一人では、世界に届きません。仲間と、焚き火を囲みながら、組んでいきましょう。席で、お待ちしています。おあとがよろしいようで。", "You can't reach the world alone. Let's build it with friends, around the fire. I'll be saving you a seat. And that, as the rakugo masters say, is where I take my bow."], "yomi": ["エーアイは、入れて、動かして、初めて自分のものになります。てしかが・びるわで、一緒にその最初の一回を。難しく考えず、まずは席だけ、先に確保してください。日付は、それから一緒に決めましょう。火は、もう点いています。一人では、世界に届きません。仲間と、焚き火を囲みながら、組んでいきましょう。席で、お待ちしています。おあとがよろしいようで。"], "srcs": [{"t": "▶ 席を確保する（参加T・MU）", "u": "https://yukihamada.jp/seki"}, {"t": "📝 席を確保したら → 参加カルテに記入", "u": "https://yukihamada.jp/kamisibai/gasshuku/apply/"}, {"t": "AI合宿ストア（行くか、決めないか）", "u": "https://wearmu.com/shop?brand=ai-camp-iku"}], "final": true, "audio": ["audio/08.mp3", "audio/08.mp3"]}];
const UI={"sub": ["AI合宿2026 in 弟子屈・美留和 ・ 全8枚 ・ ぼくの声つき", "AI Camp 2026 in Teshikaga・Biruwa ・ 8 cards ・ with my voice"], "voice": ["▶ ぼくの声で読み上げる", "▶ Narrate in my voice"], "voiceStop": ["⏸ 読み上げをとめる", "⏸ Stop narration"], "who": ["🧠 ここが大事", "🧠 The point"], "hint": ["▶でぼくの声(AIクローン)が読み上げ、終わると次の枚へ自動でめくれます ・ 手めくりは絵の左右タップ/←→キー ・ Escで停止", "Press ▶ for narration by my AI voice clone — cards turn automatically. Manual: tap left/right on the art, ←→ keys. Esc stops."], "srcsum": ["出典・根拠 ▸", "Sources ▸"], "srcnote": ["※席=参加T(¥100,000)。日付は未定でも確保できます。宿泊・食事・研修費は別(研修費は個人/法人・役職・会社規模で変動)。", "A 'seat' = the participation tee (¥100,000). You can reserve even with the date undecided. Lodging, meals and training fees are separate (training varies by individual/corporate, role and company size)."], "foot": ["絵: Gemini ・ 声: 濱田優貴の本人声AIクローン(Koe/m5・ローカル) ・ 文: Claude + 濱田優貴 ・ <a href=\"https://yukihamada.jp\">yukihamada.jp</a>", "Art: Gemini ・ Voice: Yuki Hamada's local AI clone (Koe/m5) ・ Words: Claude + Yuki Hamada ・ <a href=\"https://yukihamada.jp\">yukihamada.jp</a>"], "prev": ["前の枚へ", "Previous card"], "next": ["次の枚へ", "Next card"], "dot": ["第%枚へ", "Go to card %"], "share": ["この枚のリンクを共有", "Share this card"], "copied": ["リンクをコピーしました", "Link copied"], "audioErr": ["音声を読み込めませんでした", "Could not load the audio"], "retry": ["⟳ もう一度", "⟳ Retry"]};
let i=0,L=0,voice=false,busy=false,audioFor=-1,rate=1;
const RATES=[1,1.25,1.5];
const $=id=>document.getElementById(id);
const artTop=$("artTop"),artUnder=$("artUnder"),titleplate=$("titleplate"),
 no=$("no"),title=$("title"),ja=$("ja"),kanso=$("kanso"),who=$("who"),card=$("card"),
 dots=$("dots"),voiceBtn=$("voiceBtn"),rateBtn=$("rateBtn"),hint=$("hint"),sub=$("sub"),foot=$("foot"),
 srcs=$("srcs"),srcsum=$("srcsum"),srclist=$("srclist"),srcnote=$("srcnote"),
 toast=$("toast"),langBtn=$("langBtn"),shareBtn=$("shareBtn");
const player=new Audio();player.preload="metadata";
let prefetcher=null;
let sentEls=[],sentW=[],sentTotal=0;
function srcset(b){return `img/${b}-700.webp 700w, img/${b}-1400.webp 1400w`}
function setImg(el,b){el.srcset=srcset(b);el.sizes="(max-width:880px) 96vw, 840px";el.src=`img/${b}.jpg`}
SLIDES.forEach((s,k)=>{const btn=document.createElement("button");btn.className="dot";btn.onclick=()=>show(k);dots.appendChild(btn)});
function splitSent(text,el){
 el.innerHTML="";
 const parts=[];let buf="";
 for(const ch of text){buf+=ch;if("。！？.?!".includes(ch)){parts.push(buf);buf=""}}
 if(buf.trim())parts.push(buf);
 return parts.map(p=>{const sp=document.createElement("span");sp.className="sent";sp.textContent=p;el.appendChild(sp);return sp});
}
function renderText(){
 const s=SLIDES[i];
 no.textContent=s.no[L];title.textContent=s.title[L];
 const jaSp=splitSent(s.ja[L],ja),kSp=splitSent(s.kanso[L],kanso);
 sentEls=[...jaSp,...kSp];
 sentW=sentEls.map(e=>e.textContent.length);sentTotal=sentW.reduce((a,b)=>a+b,0);
 who.textContent=UI.who[L];hint.textContent=UI.hint[L];sub.textContent=UI.sub[L];foot.innerHTML=UI.foot[L];
 srcsum.textContent=UI.srcsum[L];srcnote.textContent=UI.srcnote[L];
 voiceBtn.textContent=voice?UI.voiceStop[L]:UI.voice[L];
 $("navPrev").setAttribute("aria-label",UI.prev[L]);$("navNext").setAttribute("aria-label",UI.next[L]);
 shareBtn.setAttribute("aria-label",UI.share[L]);shareBtn.title=UI.share[L];
 langBtn.textContent=L?"日本語":"EN";document.documentElement.lang=L?"en":"ja";
 srclist.innerHTML="";
 if(s.srcs&&s.srcs.length){srcs.style.display="";s.srcs.forEach(x=>{const li=document.createElement("li");const a=document.createElement("a");a.href=x.u;a.rel="noopener";a.target="_blank";a.textContent=x.t;li.appendChild(a);srclist.appendChild(li)})}
 else srcs.style.display="none";
 [...dots.children].forEach((d,k)=>{d.classList.toggle("on",k===i);d.setAttribute("aria-label",UI.dot[L].replace("%",k+1));if(k===i)d.setAttribute("aria-current","true");else d.removeAttribute("aria-current")});
 artTop.alt=SLIDES[i].alt;
 titleplate.classList.toggle("on",i===0);
}
function preloadAdjacent(){
 [i+1,i-1].forEach(k=>{if(k>=0&&k<SLIDES.length){const im=new Image();im.srcset=srcset(SLIDES[k].b);im.src=`img/${SLIDES[k].b}.jpg`}});
 if(voice&&i+1<SLIDES.length){if(!prefetcher)prefetcher=new Audio();prefetcher.preload="auto";prefetcher.src=SLIDES[i+1].audio[L]}
}
function show(k,dir){
 if(busy)return;
 const n=(k+SLIDES.length)%SLIDES.length;
 if(n===i){renderText();return}
 dir=dir||(n>i?1:-1);
 busy=true;
 setImg(artUnder,SLIDES[n].b);
 i=n;renderText();
 try{history.replaceState(null,"",`?card=${i+1}`)}catch(e){}
 artTop.style.transition="transform .45s cubic-bezier(.4,0,.6,1)";
 artTop.style.transform=`translateX(${dir>0?-106:106}%)`;
 setTimeout(()=>{
  setImg(artTop,SLIDES[i].b);
  artTop.style.transition="none";artTop.style.transform="none";
  busy=false;preloadAdjacent();
 },470);
 playCurrent();
}
function playCurrent(){
 if(!voice)return;
 const want=SLIDES[i].audio[L];if(player.getAttribute("data-src")!==want){player.src=want;player.setAttribute("data-src",want);audioFor=i}
 player.playbackRate=rate;
 player.play().catch(()=>{audioFor=-1;setVoice(false);showToast(UI.audioErr[L],true)});
}
player.addEventListener("ended",()=>{if(voice&&i<SLIDES.length-1)show(i+1,1);else if(voice)setVoice(false)});
player.addEventListener("timeupdate",()=>{
 if(!voice||!player.duration||!sentTotal)return;
 const p=player.currentTime/player.duration;
 let acc=0,active=sentEls.length-1;
 for(let k=0;k<sentW.length;k++){acc+=sentW[k]/sentTotal;if(p<acc){active=k;break}}
 sentEls.forEach((e,k)=>e.classList.toggle("on",k===active));
});
function clearHighlight(){sentEls.forEach(e=>e.classList.remove("on"))}
function setVoice(on){voice=on;voiceBtn.classList.toggle("playing",on);voiceBtn.textContent=on?UI.voiceStop[L]:UI.voice[L];if(!on){player.pause();clearHighlight()}}
function toggleVoice(){
 if(voice){setVoice(false);return}
 setVoice(true);
 const want=SLIDES[i].audio[L];if(player.getAttribute("data-src")!==want){player.src=want;player.setAttribute("data-src",want);audioFor=i}
 player.playbackRate=rate;
 player.play().then(()=>preloadAdjacent()).catch(()=>{audioFor=-1;setVoice(false);showToast(UI.audioErr[L],true)});
}
function cycleRate(){rate=RATES[(RATES.indexOf(rate)+1)%RATES.length];rateBtn.textContent=rate+"x";player.playbackRate=rate}
function showToast(msg,withRetry){
 toast.innerHTML="";toast.append(msg);
 if(withRetry){const b=document.createElement("button");b.textContent=UI.retry[L];b.onclick=()=>{toast.classList.remove("on");toggleVoice()};toast.appendChild(b)}
 toast.classList.add("on");
 setTimeout(()=>toast.classList.remove("on"),5000);
}
function shareCard(){
 const url=location.href.split("?")[0]+`?card=${i+1}`;
 const title=SLIDES[i].title[L];
 if(navigator.share){navigator.share({title,url}).catch(()=>{})}
 else{navigator.clipboard.writeText(url).then(()=>showToast(UI.copied[L])).catch(()=>showToast(UI.copied[L]))}
}
function toggleLang(){
 if(voice){setVoice(false);player.currentTime=0;audioFor=-1}
 L=1-L;renderText();clearHighlight();
}
function go(d){show(i+d,d)}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")go(1);
 if(e.key==="ArrowLeft")go(-1);
 if(e.key==="Escape"&&voice)setVoice(false);
});
let tx=null;
const wrap=document.querySelector(".art-wrap");
wrap.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
wrap.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)go(dx<0?1:-1);tx=null},{passive:true});
const qp=parseInt(new URLSearchParams(location.search).get("card"),10);
const start=qp>=1&&qp<=SLIDES.length?qp:1;
i=start-1;
setImg(artTop,SLIDES[i].b);setImg(artUnder,SLIDES[i].b);
renderText();preloadAdjacent();
</script>
