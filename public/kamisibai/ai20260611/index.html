  ja:["規制も動きました——主に、後ろへ。EUのAI法は8月2日に全面適用日を迎えますが、目玉のハイリスク義務は2027年末〜2028年へ延期する政治合意が直前に成立。米コロラド州のAI法も、6月30日施行のはずが5月の改正で2027年1月へ延期+内容も縮小されました。世界そろって「先生、宿題の提出期限を延ばしてください」の夏です。",
      "Regulation moved too — mostly backwards. The EU AI Act hits its general application date on August 2, but a last-minute political agreement postpones the headline high-risk obligations to late 2027–2028. Colorado's AI Act, due June 30, was amended in May: delayed to January 2027 and scaled back. The whole world, in unison: 'Teacher, can we have an extension on the homework?'"],
  kanso:["笑い話に見えて、実は重い話。技術が速すぎて、ルールを書いている間に前提が変わってしまう。だから僕は法律を待たずに「AIは提案まで、最後のスイッチは人が押す」を全プロダクト共通の原則にしています。今日も僕の広告AIの提案を、僕が承認してから流しました。",
      "It sounds like a joke, but it's heavy: technology now outruns the ink of the law. So I don't wait for legislation — every product I run follows one rule: AI proposes, a human presses the final switch. Just today, my ad-ops AI drafted a plan, and I approved it before it went live."],
  srcs:[{t:"欧州委員会: AI Act (公式)",u:"https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"},{t:"Gibson Dunn: Omnibus合意でハイリスク義務延期",u:"https://www.gibsondunn.com/eu-ai-act-omnibus-agreement-postponed-high-risk-deadlines-and-other-key-changes/"},{t:"コロラド州議会: SB24-205 (公式)",u:"https://leg.colorado.gov/bills/sb24-205"},{t:"Hunton: SB189で2027年1月に延期・縮小",u:"https://www.hunton.com/privacy-and-cybersecurity-law-blog/colorado-ai-act-amended-and-effective-date-delayed"}]},
 {b:"08_end",audio:"audio/08.mp3",no:["第八枚","Card 8"],
  alt:"夜の路地で紙芝居屋が舞台の扉を閉じ、観客が回路の星座の下を歩いて帰る。少女が手のひらの小さな火を見せて微笑む",
  title:["おしまい——どうしていくべきか","The End — So, What Do We Do?"],
  ja:["AIは「すごい道具」から、「選んで、使って、責任を持つ道具」になりました。じゃあ、僕らはどうするか。僕の答えは3つ。ひとつ、特定のモデルに依存しない作りにする——明日には順位が入れ替わるので。ふたつ、すべてのサービスをMCPでエージェントに開く。みっつ、スピードはAIに任せて、最後の判断と責任は人間が持つ。",
      "AI has gone from 'an amazing tool' to 'a tool you choose, use, and answer for.' So what do we do? I carry three answers. One: build model-agnostic — tomorrow the leaderboard flips. Two: open every service to agents via MCP. Three: let AI bring the speed, while humans keep the final call and the responsibility."],
  kanso:["AIは火吹き棒です。どれだけ高性能な火吹き棒が出ても、火を点けるのはあなた。そして焚き火は、一人では囲めません。仲間と、作っていきましょう。おあとがよろしいようで。",
      "AI is the fire-blowing pipe. However powerful the pipe becomes, you are the one who lights the fire — and a campfire is never a party of one. Let's build it with friends. And that, as the rakugo masters say, is where I take my bow."],
  srcs:[{t:"Build Fast with AI: AI News June 8, 2026",u:"https://www.buildfastwithai.com/blogs/ai-news-today-june-8-2026"},{t:"Crescendo.ai: Latest AI News",u:"https://www.crescendo.ai/news/latest-ai-news-and-updates"}],final:true},
];
const UI={
 sub:["2026年6月の紙芝居 ・ 全8枚 ・ 濱田優貴の感想と声つき","A kamishibai of June 2026 ・ 8 cards ・ with Yuki Hamada's commentary & voice"],
 voice:["▶ 僕の声で読み上げる","▶ Narrate (Japanese voice)"],
 voiceStop:["⏸ 読み上げをとめる","⏸ Stop narration"],
 who:["🔥 ぼくの感想","🔥 My take"],
 hint:["▶で僕の声(AIクローン)が読み上げ、終わると次の枚へ自動でめくれます ・ 手めくりは絵の左右タップ/←→キー ・ Escで停止","Press ▶ for narration by my AI voice clone (Japanese; English audio coming) — cards turn automatically. Manual: tap left/right on the art, ←→ keys. Esc stops."],
 srcsum:["出典 ▸","Sources ▸"],
 srcnote:["※調査日2026-06-11。評価額・設備投資額・パラメータ数などは各報道ベースの数字です。","Researched 2026-06-11. Valuations, capex and parameter counts are as reported by the cited outlets."],
 foot:['絵: Gemini ・ 声: 濱田優貴のAIクローン(Koe) ・ 文: Claude + 濱田優貴 ・ <a href="https://yukihamada.jp">yukihamada.jp</a>','Art: Gemini ・ Voice: AI clone of Yuki Hamada (Koe) ・ Words: Claude + Yuki Hamada ・ <a href="https://yukihamada.jp">yukihamada.jp</a>'],
 prev:["前の枚へ","Previous card"],next:["次の枚へ","Next card"],
 dot:["第%枚へ","Go to card %"],
 share:["この枚のリンクを共有","Share this card"],
 copied:["リンクをコピーしました","Link copied"],
 audioErr:["音声を読み込めませんでした","Could not load the audio"],retry:["⟳ もう一度","⟳ Retry"],
};
let i=0,L=0,voice=false,busy=false,audioFor=-1,rate=1;
const RATES=[1,1.25,1.5];
const $=id=>document.getElementById(id);
const artTop=$("artTop"),artUnder=$("artUnder"),titleplate=$("titleplate"),
 no=$("no"),title=$("title"),ja=$("ja"),kanso=$("kanso"),who=$("who"),card=$("card"),
 dots=$("dots"),voiceBtn=$("voiceBtn"),rateBtn=$("rateBtn"),hint=$("hint"),sub=$("sub"),foot=$("foot"),
 srcs=$("srcs"),srcsum=$("srcsum"),srclist=$("srclist"),srcnote=$("srcnote"),
 toast=$("toast"),langBtn=$("langBtn"),shareBtn=$("shareBtn");
const player=new Audio();player.preload="metadata";
let prefetcher=null;
let sentEls=[],sentW=[],sentTotal=0;
function srcset(b){return `img/${b}-700.webp 700w, img/${b}-1400.webp 1400w`}
function setImg(el,b){el.srcset=srcset(b);el.sizes="(max-width:880px) 96vw, 840px";el.src=`img/${b}.jpg`}
SLIDES.forEach((s,k)=>{const btn=document.createElement("button");btn.className="dot";btn.onclick=()=>show(k);dots.appendChild(btn)});
function splitSent(text,el){
 el.innerHTML="";
 const parts=[];let buf="";
 for(const ch of text){buf+=ch;if("。!?.?!".includes(ch)){parts.push(buf);buf=""}}
 if(buf.trim())parts.push(buf);
 return parts.map(p=>{const sp=document.createElement("span");sp.className="sent";sp.textContent=p;el.appendChild(sp);return sp});
}
function renderText(){
 const s=SLIDES[i];
 no.textContent=s.no[L];title.textContent=s.title[L];
 const jaSp=splitSent(s.ja[L],ja),kSp=splitSent(s.kanso[L],kanso);
 sentEls=[...jaSp,...kSp];
 sentW=sentEls.map(e=>e.textContent.length);sentTotal=sentW.reduce((a,b)=>a+b,0);
 who.textContent=UI.who[L];hint.textContent=UI.hint[L];sub.textContent=UI.sub[L];foot.innerHTML=UI.foot[L];
 srcsum.textContent=UI.srcsum[L];srcnote.textContent=UI.srcnote[L];
 voiceBtn.textContent=voice?UI.voiceStop[L]:UI.voice[L];
 $("navPrev").setAttribute("aria-label",UI.prev[L]);$("navNext").setAttribute("aria-label",UI.next[L]);
 shareBtn.setAttribute("aria-label",UI.share[L]);shareBtn.title=UI.share[L];
 langBtn.textContent=L?"日本語":"EN";document.documentElement.lang=L?"en":"ja";
 srclist.innerHTML="";
 if(s.srcs.length){srcs.style.display="";s.srcs.forEach(x=>{const li=document.createElement("li");const a=document.createElement("a");a.href=x.u;a.rel="noopener";a.target="_blank";a.textContent=x.t;li.appendChild(a);srclist.appendChild(li)})}
 else srcs.style.display="none";
 [...dots.children].forEach((d,k)=>{d.classList.toggle("on",k===i);d.setAttribute("aria-label",UI.dot[L].replace("%",k+1));if(k===i)d.setAttribute("aria-current","true");else d.removeAttribute("aria-current")});
 artTop.alt=SLIDES[i].alt;
 titleplate.classList.toggle("on",i===0);
}
function preloadAdjacent(){
 [i+1,i-1].forEach(k=>{if(k>=0&&k<SLIDES.length){const im=new Image();im.srcset=srcset(SLIDES[k].b);im.src=`img/${SLIDES[k].b}.jpg`}});
 if(voice&&i+1<SLIDES.length){if(!prefetcher)prefetcher=new Audio();prefetcher.preload="auto";prefetcher.src=SLIDES[i+1].audio}
}
function show(k,dir){
 if(busy)return;
 const n=(k+SLIDES.length)%SLIDES.length;
 if(n===i){renderText();return}
 dir=dir||(n>i?1:-1);
 busy=true;
 setImg(artUnder,SLIDES[n].b);
 i=n;renderText();
 history.replaceState(null,"",`?card=${i+1}`);
 artTop.style.transition="transform .45s cubic-bezier(.4,0,.6,1)";
 artTop.style.transform=`translateX(${dir>0?-106:106}%)`;
 setTimeout(()=>{
  setImg(artTop,SLIDES[i].b);
  artTop.style.transition="none";artTop.style.transform="none";
  busy=false;preloadAdjacent();
 },470);
 playCurrent();
}
function playCurrent(){
 if(!voice)return;
 if(audioFor!==i){player.src=SLIDES[i].audio;audioFor=i}
 player.playbackRate=rate;
 player.play().catch(()=>{audioFor=-1;setVoice(false);showToast(UI.audioErr[L],true)});
}
player.addEventListener("ended",()=>{if(voice&&i<SLIDES.length-1)show(i+1,1);else if(voice)setVoice(false)});
player.addEventListener("timeupdate",()=>{
 if(!voice||!player.duration||!sentTotal)return;
 const p=player.currentTime/player.duration;
 let acc=0,active=sentEls.length-1;
 for(let k=0;k<sentW.length;k++){acc+=sentW[k]/sentTotal;if(p<acc){active=k;break}}
 sentEls.forEach((e,k)=>e.classList.toggle("on",k===active));
});
function clearHighlight(){sentEls.forEach(e=>e.classList.remove("on"))}
function setVoice(on){voice=on;voiceBtn.classList.toggle("playing",on);voiceBtn.textContent=on?UI.voiceStop[L]:UI.voice[L];if(!on){player.pause();clearHighlight()}}
function toggleVoice(){
 if(voice){setVoice(false);return}
 setVoice(true);
 if(audioFor!==i){player.src=SLIDES[i].audio;audioFor=i}
 player.playbackRate=rate;
 player.play().then(()=>preloadAdjacent()).catch(()=>{audioFor=-1;setVoice(false);showToast(UI.audioErr[L],true)});
}
function cycleRate(){rate=RATES[(RATES.indexOf(rate)+1)%RATES.length];rateBtn.textContent=rate+"x";player.playbackRate=rate}
function showToast(msg,withRetry){
 toast.innerHTML="";toast.append(msg);
 if(withRetry){const b=document.createElement("button");b.textContent=UI.retry[L];b.onclick=()=>{toast.classList.remove("on");toggleVoice()};toast.appendChild(b)}
 toast.classList.add("on");
 setTimeout(()=>toast.classList.remove("on"),5000);
}
function shareCard(){
 const url=`https://yukihamada.jp/kamisibai/ai20260611/?card=${i+1}`;
 const title=SLIDES[i].title[L]+" — AIの、いま。";
 if(navigator.share){navigator.share({title,url}).catch(()=>{})}
 else{navigator.clipboard.writeText(url).then(()=>showToast(UI.copied[L]))}
}
function toggleLang(){
 if(voice){setVoice(false);player.currentTime=0;audioFor=-1}
 L=1-L;renderText();clearHighlight();
}
function go(d){show(i+d,d)}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")go(1);
 if(e.key==="ArrowLeft")go(-1);
 if(e.key==="Escape"&&voice)setVoice(false);
});
let tx=null;
const wrap=document.querySelector(".art-wrap");
wrap.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
wrap.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)go(dx<0?1:-1);tx=null},{passive:true});
const qp=parseInt(new URLSearchParams(location.search).get("card"),10);
const hh=parseInt(location.hash.slice(1),10);
const start=qp>=1&&qp<=SLIDES.length?qp:(hh>=1&&hh<=SLIDES.length?hh:1);
i=start-1;
setImg(artTop,SLIDES[i].b);setImg(artUnder,SLIDES[i].b);
renderText();preloadAdjacent();
</script>
</body>
</html>
