<script>
const SLIDES=[{"b": "01_title", "scene": "A small wooden kamishibai stage on a bicycle at dusk on a quiet street, its frame glowing with soft circuit-like light; orbiting the stage like small planets are glowing coins of light and tiny rolled paper rule-scrolls; children and adults gather; warm hand-painted gouache, deep blue twilight and lantern orange", "no": ["第一枚", "Card 1"], "alt": "夕暮れの路地、自転車の木の紙芝居舞台が回路の光をまとう。周りを光のコインと小さな規則の巻物が惑星のように回る。人々が集まる", "title": ["はじまり、はじまり〜", "Here we go—"], "ja": ["今日は2026年6月20日。ここ最近のAIニュースを見ると、派手な新モデルよりも、その『まわり』——お金とルール——が大きく動いていました。投資、データセンター、規制、国家戦略。今週のAIを、8枚にぎゅっと絞ってお届けします。", "It's June 20, 2026. Looking at recent AI news, the story wasn't a flashy new model — it was everything around it: money and rules. Funding, data centers, regulation, national strategy. Here's the week in AI, in eight tightly-packed cards."], "kanso": ["毎日AIと一緒にプロダクトを作っている僕には、こういう『お金とルールが回り出す音』が、次に何が来るかの予報に聞こえます。読み上げは今日も僕の声のAIクローン。本人は隣でお茶を飲んでいます。", "As someone who builds products with AI every day, the sound of money and rules starting to turn is, to me, a forecast of what's coming next. The narration is again an AI clone of my voice — the real me is beside it, drinking tea."], "yomi": ["きょうは にせんにじゅうろくねん ろくがつ はつか。ここ最近のエーアイニュースを見ると、派手な新モデルよりも、その『まわり』、お金とルールが、大きく動いていました。投資、データセンター、規制、国家戦略。今週のエーアイを、はちまいに ぎゅっと絞ってお届けします。毎日エーアイと一緒にプロダクトを作っている僕には、こういう『お金とルールが回り出す音』が、次に何が来るかの予報に聞こえます。読み上げは今日も僕の声のエーアイクローン。本人は、となりでお茶を飲んでいます。"], "srcs": [], "audio": ["audio/01.mp3", "audio/01.mp3"]}, {"b": "02_grok", "scene": "A strong friendly glowing spirit, like a personified AI model, politely stepping through an office doorway and taking a seat at a desk among human office workers; behind them, shelves lined with other glowing model-orbs arranged like products on sale; warm watercolor, deep blue and lantern orange", "no": ["第二枚", "Card 2"], "alt": "強く優しい光の精(AIモデル)が会社のドアをくぐり、人間の同僚に交じって机につく。背後の棚には商品のように並ぶ別の光るモデルたち", "title": ["モデルが、会社の現場へ", "A Model Walks Into the Office"], "ja": ["まずはモデルの話を一つ。xAIのGrok 4.3が、AWSのBedrock上で一般提供になったと報じられています。報道では、100万トークンの長い文脈や、調整できる推論レベルを備え、企業がAIエージェントを組むための部品として置かれた、とのことです。", "First, one model story. xAI's Grok 4.3 reportedly became generally available on AWS Bedrock. According to reports, it offers a one-million-token context and adjustable reasoning levels, placed as a building block for enterprises assembling AI agents."], "kanso": ["モデルは『すごい』から『使える部品』へ。どのクラウドの棚にも、強いモデルが並び始めました。僕の作り方はずっと同じ——特定のモデルに賭けない。明日また順位が入れ替わっても、棚から選び直すだけでいいように。", "Models are shifting from 'amazing' to 'usable parts.' Strong models are lining the shelves of every cloud. My approach never changes: don't bet on one model, so that when tomorrow's ranking flips, I just pick again off the shelf."], "yomi": ["まずはモデルの話を一つ。エックスエーアイのグロック よんてんさんが、エーダブリューエスのベッドロックの上で、一般提供になったと報じられています。報道では、ひゃくまんトークンの長い文脈や、調整できる推論レベルを備え、企業がエーアイエージェントを組むための部品として置かれた、とのことです。モデルは『すごい』から『使える部品』へ。どのクラウドの棚にも、強いモデルが並び始めました。僕の作り方はずっと同じ。特定のモデルに賭けない。明日また順位が入れ替わっても、棚から選び直すだけでいいように。"], "srcs": [{"t": "Releasebot: xAI更新(Grok 4.3 / Bedrock)", "u": "https://releasebot.io/updates/xai"}], "audio": ["audio/02.mp3", "audio/02.mp3"]}, {"b": "03_openrouter", "scene": "A bustling night marketplace exchange where a single grand lantern-lit gateway routes glowing streams of token-light out to dozens of differently-colored model-stalls; coins of light raining down onto the gatekeeper's booth at the center; bridges and threads connecting all stalls; warm gouache, deep blue and orange", "no": ["第三枚", "Card 3"], "alt": "夜の市場。中央の大きな提灯の門が、光のトークンを色とりどりのモデル露店へ振り分ける。門番の受付に光のコインが降り注ぐ", "title": ["AIの『交換所』に、お金が集まる", "Money Floods the AI Exchange"], "ja": ["お金の話へ。たくさんのAIモデルを一つの入り口でつなぐOpenRouterが、1億1300万ドルを調達し、評価額は約13億ドルになったと報じられています(発表は先月)。週に処理する量は半年で5兆から25兆トークンへ増えた、とされています。モデルそのものより、モデルを『配る場所』に資金が向かっています。", "To the money. OpenRouter — which connects many AI models behind a single doorway — reportedly raised 113 million dollars at a valuation of about 1.3 billion (announced last month). Its weekly volume is said to have grown from 5 to 25 trillion tokens in half a year. Capital is flowing not to the models themselves, but to where models are distributed."], "kanso": ["強い人(モデル)より、強い人を案内する受付(ルーター)が儲かる——市場が成熟してきた合図です。僕も全プロダクトをMCPで開いていますが、これからは『どのモデルか』より『どう届けるか』が勝負だと、改めて思いました。", "The receptionist who routes you to the strong (the router) earns more than the strong themselves (the models) — a sign the market is maturing. I keep all my products open via MCP, and this reminds me: the contest ahead is less 'which model' and more 'how you deliver it.'"], "yomi": ["お金の話へ。たくさんのエーアイモデルを、一つの入り口でつなぐ、オープンルーターが、いちおく せんさんびゃくまんドルを調達し、評価額は やく じゅうさんおくドルになったと報じられています。発表は先月です。週に処理する量は、はんとしで ごちょうから にじゅうごちょうトークンへ増えた、とされています。モデルそのものより、モデルを『配る場所』に、資金が向かっています。強い人、モデルより、強い人を案内する受付、ルーターが儲かる。市場が成熟してきた合図です。僕も全プロダクトをエムシーピーで開いていますが、これからは『どのモデルか』より『どう届けるか』が勝負だと、改めて思いました。"], "srcs": [{"t": "OpenRouter公式: Series B発表", "u": "https://openrouter.ai/announcements/series-b"}, {"t": "TechCrunch: OpenRouter $1.3B評価(5/26)", "u": "https://techcrunch.com/2026/05/26/openrouter-more-than-doubles-valuation-to-1-3b-in-a-year/"}], "audio": ["audio/03.mp3", "audio/03.mp3"]}, {"b": "04_softbank", "scene": "A vast twilight landscape where huge data-center halls rise beside enormous glowing electrical pylons and a wide river; tiny human figures planting flags on the land; rivers of golden light-coins flowing into the ground and along the power lines; warm watercolor, deep blue and lantern orange", "no": ["第四枚", "Card 4"], "alt": "夕暮れの広大な風景。巨大なデータセンターと光る送電鉄塔、大きな川。土地に旗を立てる小さな人影。金色のコインが地面と送電線へ流れ込む", "title": ["お金は、電気と土地へ", "The Money Goes to Power and Land"], "ja": ["もっと大きなお金も。ソフトバンクグループがフランスで、最大750億ユーロを投じて5ギガワット規模のAIデータセンターを整える計画を発表したと報じられています(今月初旬のサミットにて)。AIの競争は、賢さの競争から、電力と土地と冷却の競争へと、土俵を移しつつあります。", "Bigger money, too. SoftBank Group reportedly announced a plan in France to build up to 5 gigawatts of AI data-center capacity, investing as much as 75 billion euros (at a summit early this month). The AI race is shifting its arena from cleverness to a contest over power, land, and cooling."], "kanso": ["AIの正体は、最後は『電気』です。賢さの裏で、国と企業が電力と土地を奪い合っている。派手な発表の下に、地味なインフラの戦争がある——ここを見ておくと、ニュースの解像度が一段上がります。", "At bottom, AI is electricity. Behind the cleverness, states and companies are fighting over power and land. Beneath the flashy announcements lies a quiet war over infrastructure — watch it, and the news comes into much sharper focus."], "yomi": ["もっと大きなお金も。ソフトバンクグループが、フランスで、さいだい ななひゃくごじゅうおくユーロを投じて、ごギガワット規模のエーアイデータセンターを整える計画を発表したと報じられています。今月初旬のサミットにてです。エーアイの競争は、賢さの競争から、電力と土地と冷却の競争へと、土俵を移しつつあります。エーアイの正体は、最後は『電気』です。賢さの裏で、国と企業が、電力と土地を奪い合っている。派手な発表の下に、地味なインフラの戦争がある。ここを見ておくと、ニュースの解像度が、いちだん上がります。"], "srcs": [{"t": "SoftBank Group 公式プレス(Choose France)", "u": "https://group.softbank/en/news/press/20260531_0"}], "audio": ["audio/04.mp3", "audio/04.mp3"]}, {"b": "05_neura", "scene": "A friendly rounded humanoid robot standing in a bright workshop, being showered from above with golden coins of light pouring from investors' floating lanterns; cranes and a factory line in the background; warm gouache, deep blue twilight and lantern orange", "no": ["第五枚", "Card 5"], "alt": "明るい工房に立つ丸みのある人型ロボット。上空の投資家の提灯から金色のコインが降り注ぐ。背景にクレーンと工場ライン", "title": ["体を持つAIに、賭けが集まる", "Bets Pile Onto AI With a Body"], "ja": ["お金はロボットにも。ドイツのNeura Roboticsが、最大14億ドルとされる大型調達を実施したと報じられています。AmazonやNVIDIA、Qualcommなどが名を連ねたとされ、『体を持つAI(フィジカルAI)』への資金集中を示す、と伝えられています。", "Money is going to robots, too. Germany's Neura Robotics reportedly carried out a large raise said to reach up to 1.4 billion dollars. Amazon, NVIDIA, and Qualcomm are said to be among the backers — a sign, reports suggest, of capital concentrating on 'AI with a body,' or physical AI."], "kanso": ["画面の中のAIから、工場や家で動くAIへ。お金は正直で、次に来る場所を指さします。言葉が形になる未来に、僕も毎日少しずつ賭けています。", "From AI on a screen to AI that moves in factories and homes. Money is honest; it points at where things are headed next. I, too, bet a little every day on a future where words become physical form."], "yomi": ["お金はロボットにも。ドイツのノイラ・ロボティクスが、さいだい じゅうよんおくドルとされる大型調達を実施したと報じられています。アマゾンやエヌビディア、クアルコムなどが名を連ねたとされ、『体を持つエーアイ、フィジカルエーアイ』への資金集中を示す、と伝えられています。画面の中のエーアイから、工場や家で動くエーアイへ。お金は正直で、次に来る場所を指さします。言葉が形になる未来に、僕も毎日少しずつ賭けています。"], "srcs": [{"t": "CNBC: Neura Robotics 調達(6/10)", "u": "https://www.cnbc.com/2026/06/10/neura-robotics-funding-ai-humanoid-robots.html"}], "audio": ["audio/05.mp3", "audio/05.mp3"]}, {"b": "06_eu", "scene": "A wise judge in robes hanging a large glowing rulebook-shaped lantern, stamped with a small 'AI label' seal, over a street of glowing AI spirit-stalls; vendors calmly attaching honest little labels to their glowing wares; scales of justice subtly drawn in the clouds; warm watercolor, deep blue and orange", "no": ["第六枚", "Card 6"], "alt": "ローブの裁判官が、小さな『AI表示』の印を押した規則本型の提灯を、光るAI露店の通りに掲げる。露店主が商品に正直な札をつける。雲に天秤", "title": ["ルールが、追いついてくる", "The Rules Catch Up"], "ja": ["ルールの話も。欧州委員会が、AIが作ったコンテンツの透明性についての『実践規範』を公表したと報じられています。8月2日に始まるAI法の表示義務に向けた任意の手引きで、ディープフェイクに統一アイコンを付ける案などが含まれる、とされています。", "Rules, too. The European Commission reportedly published a 'Code of Practice' on the transparency of AI-generated content. It's voluntary guidance ahead of the AI Act's labeling duties that begin on August 2, and is said to include ideas like a unified icon for deepfakes."], "kanso": ["作る速さに、見分ける仕組みが追いついてきた。『これはAI製です』と正直に言える設計は、これから当たり前になります。僕の紙芝居も、声はAIクローンだと毎回ちゃんと書いています。盛らない、隠さない。", "The means to tell things apart is catching up to the speed of making them. Designs that can honestly say 'this is AI-made' will soon be the norm. My kamishibai always states, every time, that the voice is an AI clone. No hype, nothing hidden."], "yomi": ["ルールの話も。欧州委員会が、エーアイが作ったコンテンツの透明性についての『実践規範』を公表したと報じられています。はちがつ ふつかに始まるエーアイ法の表示義務に向けた、任意の手引きで、ディープフェイクに統一アイコンを付ける案などが含まれる、とされています。作る速さに、見分ける仕組みが追いついてきた。『これはエーアイ製です』と正直に言える設計は、これから当たり前になります。僕の紙芝居も、声はエーアイクローンだと、毎回ちゃんと書いています。盛らない、隠さない。"], "srcs": [{"t": "European Commission: AI生成物の実践規範", "u": "https://digital-strategy.ec.europa.eu/en/policies/code-practice-ai-generated-content"}], "audio": ["audio/06.mp3", "audio/06.mp3"]}, {"b": "07_china", "scene": "An enormous lantern shaped like a stylized map rising over a wide plain where rows of identical friendly humanoid robots march in formation toward distant factories; a giant gentle translucent hand from above guiding them; warm gouache, deep blue twilight and lantern orange", "no": ["第七枚", "Card 7"], "alt": "地図の形の巨大な提灯が広い平野に昇り、同じ人型ロボットの列が工場へ向かって行進する。上空から大きな半透明の手が優しく導く", "title": ["国そのものが、動き出す", "The State Itself Starts Moving"], "ja": ["最後に国の動き。中国が、人型ロボットと『身体性AI』を産業へ一気に広げる、全国規模のプログラムを進めていると報じられています。報道では、地方政府や国有企業に導入計画を出させ、年内に相当数の配備を目指す、とされています。数字は報道ベースで、確定ではありません。", "Finally, a move by a state. China is reportedly advancing a nationwide program to rapidly spread humanoid robots and 'embodied AI' through industry. According to reports, it has local governments and state-owned enterprises submit deployment plans, aiming for substantial rollout within the year. The figures are as reported, not confirmed."], "kanso": ["企業だけでなく、国がプレイヤーになる時代。お金・ルール・国家——モデルの『まわり』が、これだけ一斉に動いている。土俵の大きさそのものが、変わってきました。", "An era where not just companies but states become players. Money, rules, the state — the world around the models is all moving at once. The very size of the arena is changing."], "yomi": ["最後に国の動き。中国が、人型ロボットと『身体性エーアイ』を産業へ一気に広げる、全国規模のプログラムを進めていると報じられています。報道では、地方政府や国有企業に導入計画を出させ、ねんないに相当数の配備を目指す、とされています。数字は報道ベースで、確定ではありません。企業だけでなく、国がプレイヤーになる時代。お金、ルール、国家。モデルの『まわり』が、これだけ一斉に動いている。土俵の大きさそのものが、変わってきました。"], "srcs": [{"t": "South China Morning Post: 中国 身体性AI国家計画", "u": "https://www.scmp.com/economy/china-economy/article/3356629/china-fast-tracks-humanoid-robots-and-embodied-ai-industry-under-nationwide-programme"}], "audio": ["audio/07.mp3", "audio/07.mp3"]}, {"b": "08_end", "scene": "A kamishibai storyteller closing the wooden stage doors at night; the audience walking home under stars that form faint circuit constellations; one child looks back smiling, cupping in their hands a small glowing spark shaped from a tiny coin and a tiny rolled rule-scroll; warm watercolor, deep blue and lantern orange", "no": ["第八枚", "Card 8"], "alt": "夜、紙芝居屋が舞台の扉を閉じる。観客が回路の星座の下を家へ帰る。少女がふり返り、小さなコインと規則の巻物でできた火を手のひらに見せて微笑む", "title": ["おしまい——どうしていくべきか", "The End — So, What Do We Do?"], "ja": ["お金とルールがモデルに追いついてきた今、僕らはどうするか。3つ。ひとつ、特定のモデルやクラウドに賭けない。ふたつ、すべてを正直に——AI製はAI製と書く。みっつ、速さはAIに任せ、最後の判断と責任は人間が持つ。今日の数字の多くは『報道では』。鵜呑みにせず、出典で確かめてください。", "Now that money and rules are catching up to the models, what do we do? Three things. One: don't bet on any single model or cloud. Two: be honest about everything — label AI-made as AI-made. Three: let AI handle the speed, while humans keep the final call and the responsibility. Many of today's figures are 'as reported' — don't take them at face value; check the sources."], "kanso": ["モデルだけ見ていると、世界の半分を見落とす。お金とルールと国——『まわり』こそ、次の地図です。仲間と一緒に、配管をつないでいきましょう。今日もまた一本、焚き火に薪を。おあとがよろしいようで。", "Watch only the models and you miss half the world. Money, rules, the state — the surroundings are the next map. Let's connect the plumbing together, with friends. One more log on the campfire today. And that, as the rakugo masters say, is where I take my bow."], "yomi": ["お金とルールがモデルに追いついてきた今、僕らはどうするか。みっつ。ひとつ、特定のモデルやクラウドに賭けない。ふたつ、すべてを正直に。エーアイ製はエーアイ製と書く。みっつ、速さはエーアイに任せ、最後の判断と責任は人間が持つ。今日の数字の多くは『報道では』。鵜呑みにせず、出典で確かめてください。モデルだけ見ていると、世界の半分を見落とす。お金とルールと国。『まわり』こそ、次の地図です。仲間と一緒に、配管をつないでいきましょう。今日もまた一本、焚き火に薪を。おあとがよろしいようで。"], "srcs": [], "final": true, "audio": ["audio/08.mp3", "audio/08.mp3"]}];

let i=0,L=0,voice=false,busy=false,audioFor=-1,rate=1;
const RATES=[1,1.25,1.5];
const $=id=>document.getElementById(id);
const artTop=$("artTop"),artUnder=$("artUnder"),titleplate=$("titleplate"),
 no=$("no"),title=$("title"),ja=$("ja"),kanso=$("kanso"),who=$("who"),card=$("card"),
 dots=$("dots"),voiceBtn=$("voiceBtn"),rateBtn=$("rateBtn"),hint=$("hint"),sub=$("sub"),foot=$("foot"),
 srcs=$("srcs"),srcsum=$("srcsum"),srclist=$("srclist"),srcnote=$("srcnote"),
 toast=$("toast"),langBtn=$("langBtn"),shareBtn=$("shareBtn");
const player=new Audio();player.preload="metadata";
let prefetcher=null;
let sentEls=[],sentW=[],sentTotal=0;
function srcset(b){return `img/${b}-700.webp 700w, img/${b}-1400.webp 1400w`}
function setImg(el,b){el.srcset=srcset(b);el.sizes="(max-width:880px) 96vw, 840px";el.src=`img/${b}.jpg`}
SLIDES.forEach((s,k)=>{const btn=document.createElement("button");btn.className="dot";btn.onclick=()=>show(k);dots.appendChild(btn)});
function splitSent(text,el){
 el.innerHTML="";
 const parts=[];let buf="";
 for(const ch of text){buf+=ch;if("。！？.?!".includes(ch)){parts.push(buf);buf=""}}
 if(buf.trim())parts.push(buf);
 return parts.map(p=>{const sp=document.createElement("span");sp.className="sent";sp.textContent=p;el.appendChild(sp);return sp});
}
function renderText(){
 const s=SLIDES[i];
 no.textContent=s.no[L];title.textContent=s.title[L];
 const jaSp=splitSent(s.ja[L],ja),kSp=splitSent(s.kanso[L],kanso);
 sentEls=[...jaSp,...kSp];
 sentW=sentEls.map(e=>e.textContent.length);sentTotal=sentW.reduce((a,b)=>a+b,0);
 who.textContent=UI.who[L];hint.textContent=UI.hint[L];sub.textContent=UI.sub[L];foot.innerHTML=UI.foot[L];
 srcsum.textContent=UI.srcsum[L];srcnote.textContent=UI.srcnote[L];
 voiceBtn.textContent=voice?UI.voiceStop[L]:UI.voice[L];
 $("navPrev").setAttribute("aria-label",UI.prev[L]);$("navNext").setAttribute("aria-label",UI.next[L]);
 shareBtn.setAttribute("aria-label",UI.share[L]);shareBtn.title=UI.share[L];
 langBtn.textContent=L?"日本語":"EN";document.documentElement.lang=L?"en":"ja";
 srclist.innerHTML="";
 if(s.srcs&&s.srcs.length){srcs.style.display="";s.srcs.forEach(x=>{const li=document.createElement("li");const a=document.createElement("a");a.href=x.u;a.rel="noopener";a.target="_blank";a.textContent=x.t;li.appendChild(a);srclist.appendChild(li)})}
 else srcs.style.display="none";
 [...dots.children].forEach((d,k)=>{d.classList.toggle("on",k===i);d.setAttribute("aria-label",UI.dot[L].replace("%",k+1));if(k===i)d.setAttribute("aria-current","true");else d.removeAttribute("aria-current")});
 artTop.alt=SLIDES[i].alt;
 titleplate.classList.toggle("on",i===0);
}
function preloadAdjacent(){
 [i+1,i-1].forEach(k=>{if(k>=0&&k<SLIDES.length){const im=new Image();im.srcset=srcset(SLIDES[k].b);im.src=`img/${SLIDES[k].b}.jpg`}});
 if(voice&&i+1<SLIDES.length){if(!prefetcher)prefetcher=new Audio();prefetcher.preload="auto";prefetcher.src=SLIDES[i+1].audio[L]}
}
function show(k,dir){
 if(busy)return;
 const n=(k+SLIDES.length)%SLIDES.length;
 if(n===i){renderText();return}
 dir=dir||(n>i?1:-1);
 busy=true;
 setImg(artUnder,SLIDES[n].b);
 i=n;renderText();
 try{history.replaceState(null,"",`?card=${i+1}`)}catch(e){}
 artTop.style.transition="transform .45s cubic-bezier(.4,0,.6,1)";
 artTop.style.transform=`translateX(${dir>0?-106:106}%)`;
 setTimeout(()=>{
  setImg(artTop,SLIDES[i].b);
  artTop.style.transition="none";artTop.style.transform="none";
  busy=false;preloadAdjacent();
 },470);
 playCurrent();
}
function playCurrent(){
 if(!voice)return;
 const want=SLIDES[i].audio[L];if(player.getAttribute("data-src")!==want){player.src=want;player.setAttribute("data-src",want);audioFor=i}
 player.playbackRate=rate;
 player.play().catch(()=>{audioFor=-1;setVoice(false);showToast(UI.audioErr[L],true)});
}
player.addEventListener("ended",()=>{if(voice&&i<SLIDES.length-1)show(i+1,1);else if(voice)setVoice(false)});
player.addEventListener("timeupdate",()=>{
 if(!voice||!player.duration||!sentTotal)return;
 const p=player.currentTime/player.duration;
 let acc=0,active=sentEls.length-1;
 for(let k=0;k<sentW.length;k++){acc+=sentW[k]/sentTotal;if(p<acc){active=k;break}}
 sentEls.forEach((e,k)=>e.classList.toggle("on",k===active));
});
function clearHighlight(){sentEls.forEach(e=>e.classList.remove("on"))}
function setVoice(on){voice=on;voiceBtn.classList.toggle("playing",on);voiceBtn.textContent=on?UI.voiceStop[L]:UI.voice[L];if(!on){player.pause();clearHighlight()}}
function toggleVoice(){
 if(voice){setVoice(false);return}
 setVoice(true);
 const want=SLIDES[i].audio[L];if(player.getAttribute("data-src")!==want){player.src=want;player.setAttribute("data-src",want);audioFor=i}
 player.playbackRate=rate;
 player.play().then(()=>preloadAdjacent()).catch(()=>{audioFor=-1;setVoice(false);showToast(UI.audioErr[L],true)});
}
function cycleRate(){rate=RATES[(RATES.indexOf(rate)+1)%RATES.length];rateBtn.textContent=rate+"x";player.playbackRate=rate}
function showToast(msg,withRetry){
 toast.innerHTML="";toast.append(msg);
 if(withRetry){const b=document.createElement("button");b.textContent=UI.retry[L];b.onclick=()=>{toast.classList.remove("on");toggleVoice()};toast.appendChild(b)}
 toast.classList.add("on");
 setTimeout(()=>toast.classList.remove("on"),5000);
}
function shareCard(){
 const url=location.href.split("?")[0]+`?card=${i+1}`;
 const title=SLIDES[i].title[L];
 if(navigator.share){navigator.share({title,url}).catch(()=>{})}
 else{navigator.clipboard.writeText(url).then(()=>showToast(UI.copied[L])).catch(()=>showToast(UI.copied[L]))}
}
function toggleLang(){
 if(voice){setVoice(false);player.currentTime=0;audioFor=-1}
 L=1-L;renderText();clearHighlight();
}
function go(d){show(i+d,d)}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")go(1);
 if(e.key==="ArrowLeft")go(-1);
 if(e.key==="Escape"&&voice)setVoice(false);
});
let tx=null;
