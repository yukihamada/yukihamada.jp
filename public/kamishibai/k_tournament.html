<!doctype html>
<html lang="ja" id="htmlroot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MU 対 既存 — 無い物を、作る。</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d8b75a; --gold2:#f4d98a; --goldd:#b8922f;
    --ink:#07070a; --beat:0; --punch:1; --flash:0; --cappop:1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;overflow:hidden;color:#fff;
    font-family:"Zen Kaku Gothic New",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;background:var(--ink);overflow:hidden}

  /* ===== scenes ===== */
  .scene{position:absolute;inset:0;opacity:0;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 7%;transition:opacity .5s ease}
  .scene.on{opacity:1}

  /* ===== title scene ===== */
  .title .tk{font-family:"Zen Antique",serif;font-size:clamp(15px,4.2vw,22px);
    letter-spacing:.4em;text-indent:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:18px;opacity:.9}
  .title .tbig{font-family:"Zen Antique",serif;font-size:clamp(34px,9vw,64px);line-height:1.18;text-align:center;
    background:linear-gradient(180deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(216,183,90,.2);
    transform:scale(calc(var(--punch)*(1+var(--beat)*.03)))}
  .title .tsub{margin-top:20px;color:#9a9484;font-size:clamp(13px,3.4vw,16px);letter-spacing:.18em;text-align:center}

  /* ===== versus card (the fight) ===== */
  .vs .card{width:min(92vw,560px);display:flex;flex-direction:column;gap:16px;
    transform:scale(calc(var(--punch)*(1+var(--beat)*.02)))}
  .vs .round{text-align:center;font-family:"Zen Antique",serif;letter-spacing:.32em;text-indent:.32em;
    color:var(--gold);font-size:clamp(13px,3.4vw,17px);opacity:.92}
  .vs .matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:10px}
  .vs .fighter{border-radius:20px;padding:20px 14px;text-align:center;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;min-height:148px;position:relative;overflow:hidden;
    border:1px solid rgba(255,255,255,.1);background:linear-gradient(165deg,#16161e,#0a0a10)}
  .vs .fighter.mu{border-color:rgba(216,183,90,.55);
    background:linear-gradient(165deg,#1d1809,#0c0a05);
    box-shadow:0 0 calc(26px+var(--beat)*70px) rgba(216,183,90,calc(.14+var(--beat)*.3))}
  .vs .fighter .fname{font-weight:900;font-size:clamp(17px,4.6vw,23px);letter-spacing:.02em}
  .vs .fighter.mu .fname{font-family:"Zen Antique",serif;
    background:linear-gradient(180deg,var(--gold2),var(--goldd));-webkit-background-clip:text;background-clip:text;color:transparent}
  .vs .fighter .fdesc{font-size:clamp(11px,3vw,13px);color:#9a9484;line-height:1.45}
  .vs .fighter .ficon{font-size:34px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
  .vs .vsmid{display:flex;align-items:center;justify-content:center;
    font-family:"Zen Antique",serif;font-size:clamp(18px,5vw,26px);color:var(--gold);
    text-shadow:0 0 16px rgba(216,183,90,.6)}
  .vs .verdict{text-align:center;margin-top:4px;font-weight:900;font-size:clamp(15px,4vw,20px);
    letter-spacing:.04em;min-height:1.4em}
  .vs .verdict.draw{color:#cfc8b4}
  .vs .verdict.win .g{background:linear-gradient(180deg,var(--gold2),var(--goldd));
    -webkit-background-clip:text;background-clip:text;color:transparent;font-family:"Zen Antique",serif}
  /* winner glow on the MU side when it takes the round */
  .vs .card.muwin .fighter.mu{box-shadow:0 0 0 2px var(--gold2),0 0 90px rgba(244,217,138,.6)}

  /* ===== reel (MU's ammo: real products) ===== */
  .reel .reelgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);
    gap:13px;width:86%;height:72%;transform:scale(calc(var(--punch)*(1+var(--beat)*.02)))}
  .reel .cell{background:#fff;border-radius:15px;overflow:hidden;position:relative;
    box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 0 1px rgba(216,183,90,.28)}
  .reel .cell img{width:100%;height:100%;object-fit:cover}

  /* ===== girl scenes (real AI woman) ===== */
  .girl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%;
    transform:scale(calc(var(--punch)*(1.02+var(--beat)*.04)))}

  /* ===== phone mock ===== */
  .phone .frame{width:min(58vw,300px);aspect-ratio:300/560;border-radius:34px;
    background:linear-gradient(160deg,#1a1a22,#050507);padding:8px;position:relative;
    box-shadow:0 0 0 2px rgba(216,183,90,.3),0 24px 70px rgba(0,0,0,.7),0 0 calc(40px+var(--beat)*80px) rgba(216,183,90,calc(.14+var(--beat)*.3));
    transform:scale(calc(var(--punch)*(1+var(--beat)*.02)))}
  .phone .frame .scr{position:absolute;inset:8px;border-radius:27px;overflow:hidden;background:#07070b}
  .phone .frame .scr img{width:100%;height:100%;object-fit:cover;object-position:center top}
  .phone .frame .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:90px;height:18px;background:#050507;border-radius:0 0 12px 12px;z-index:5}

  /* ===== ambient FX ===== */
  .glow{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(70% 55% at 50% 44%, rgba(216,183,90,calc(.08+var(--beat)*.18)), transparent 62%);
    box-shadow:inset 0 0 220px 70px rgba(0,0,0,.6)}
  .flash{position:fixed;inset:0;pointer-events:none;z-index:9;
    background:radial-gradient(60% 50% at 50% 44%, rgba(255,245,220,.92), rgba(216,183,90,.5) 45%, transparent 76%);
    opacity:var(--flash)}
  .streak{position:fixed;inset:0;pointer-events:none;z-index:3;mix-blend-mode:screen;
    background:linear-gradient(115deg, transparent 42%, rgba(244,217,138,calc(var(--beat)*.45)) 50%, transparent 58%)}
  .spk{position:fixed;z-index:4;pointer-events:none;color:var(--gold2);
    text-shadow:0 0 12px rgba(244,217,138,.9);will-change:transform,opacity}

  /* ===== wordmark (bloom logo) ===== */
  .mark{position:fixed;top:max(20px,env(safe-area-inset-top));left:0;right:0;
    text-align:center;z-index:7;display:flex;align-items:center;justify-content:center;gap:12px;opacity:.95}
  .mark svg{filter:drop-shadow(0 0 calc(8px + var(--beat)*22px) rgba(216,183,90,.85))}
  .mark .wm{font-family:"Zen Antique",serif;font-size:22px;letter-spacing:.34em;text-indent:.34em;
    background:linear-gradient(180deg,var(--gold2),var(--goldd));
    -webkit-background-clip:text;background-clip:text;color:transparent}

  /* ===== language toggle ===== */
  .lang{position:fixed;top:max(16px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));
    z-index:31;display:flex;gap:2px;align-items:center;
    background:rgba(20,20,26,.6);border:1px solid rgba(216,183,90,.35);
    border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
  .lang button{cursor:pointer;border:none;background:none;font-family:"Zen Antique",serif;
    font-size:12px;letter-spacing:.12em;color:#8d8775;padding:5px 11px;border-radius:999px;
    transition:color .2s,background .2s}
  .lang button.on{color:#1a1407;background:linear-gradient(180deg,var(--gold2),var(--goldd));font-weight:700}
  .lang button:not(.on):hover{color:var(--gold2)}

  /* ===== section label ===== */
  .sec{position:fixed;top:calc(max(20px,env(safe-area-inset-top)) + 40px);left:0;right:0;
    text-align:center;z-index:6;font-size:12px;letter-spacing:.5em;text-indent:.5em;color:var(--gold);opacity:0;
    transition:opacity .4s}
  .sec.on{opacity:.9}

  /* ===== caption ===== */
  .cap{position:fixed;bottom:7.5%;left:0;right:0;text-align:center;z-index:6;padding:0 8%;
    font-weight:900;font-size:clamp(18px,4.8vw,27px);color:#fff;opacity:0;
    text-shadow:0 2px 18px rgba(0,0,0,.95),0 0 26px rgba(216,183,90,.35);transition:opacity .35s}
  .cap.on{opacity:1}
  .cap .g{color:var(--gold2)}
  .cap .inner{display:inline-block;transform:scale(var(--cappop))}

  .prog{position:fixed;bottom:0;left:0;height:3px;width:0;z-index:8;
    background:linear-gradient(90deg,var(--goldd),var(--gold2));box-shadow:0 0 12px var(--gold)}

  /* ===== END card ===== */
  .end{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;opacity:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 45%,#15130c,#000);transition:opacity .5s}
  .end.on{opacity:1}
  .end .ebloom{filter:drop-shadow(0 0 36px rgba(216,183,90,.6))}
  .end .big{font-family:"Zen Antique",serif;font-size:clamp(30px,7.6vw,52px);text-align:center;line-height:1.2;
    background:linear-gradient(180deg,var(--gold2),var(--goldd));-webkit-background-clip:text;background-clip:text;color:transparent}
  .end .url{color:var(--gold);letter-spacing:.24em;font-size:15px;margin-top:4px}

  /* ===== START (sound gate) ===== */
  .start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:#000;cursor:pointer;transition:opacity .5s}
  .start.hide{opacity:0;pointer-events:none}
  .start .bloomwrap{filter:drop-shadow(0 0 30px rgba(216,183,90,.55))}
  .start .play{width:84px;height:84px;border-radius:50%;border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--gold);margin-top:6px}
  .start .t{font-family:"Zen Antique",serif;letter-spacing:.32em;text-indent:.32em;color:var(--gold);font-size:18px;text-align:center}
  .start .h{color:#8d8775;font-size:12px;letter-spacing:.14em;text-align:center}

  /* shared bloom svg helper */
  svg.bloom{display:block}
</style>
</head>

<script>
(function(){
  "use strict";
  const NPROD = 19;
  const PRODUCTS = Array.from({length:NPROD}, (_,i)=>'reel/r'+String(i).padStart(2,'0')+'.jpg');
  const NCELL = 12;

  // ---- i18n ---------------------------------------------------------------
  const LANG = (new URLSearchParams(location.search).get('lang') === 'en') ? 'en' : 'ja';
  const SONG = { ja:'MuMuMu.mp3', en:'MuMuMu_8.mp3' };
  const DUR  = { ja:62.96, en:47.88 };

  const I18N = {
    ja:{
      htmllang:'ja',
      title:'MU 対 既存 — 無い物を、作る。',
      startT:'MU 対 既存',

  const T = I18N[LANG];
  const dur = DUR[LANG];
  // absolute-time timeline
  const TL = T.tl.map(r=>[ +(r[0]*dur).toFixed(3), r[1], r[2], r[3], r[4] ]);

  // round id -> which fighters & MU-win flag
  const ROUND = {
    r1:{ round:'r1', left:'amazon',  mu:'mu_buy',  verdict:'r1', muwin:false },

  const ICON = { amazon:'📦', mercari:'🔁', mu_buy:'✨', mu_sell:'✨', mu_make:'✨' };

  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const stage = $('stage'), audio = $('audio'), flash = $('flash');
  const capWrap = $('cap'), capInner = capWrap.querySelector('.inner');
  const secEl = $('sec'), prog = $('prog'), endEl = $('end'), startEl = $('start');

  // ---- apply static language to DOM + song ----
  function applyLang(){
    $('htmlroot').setAttribute('lang', T.htmllang);
    document.title = T.title;
    $('startT').textContent = T.startT;
    $('startH').textContent = T.startH;
    // multi-line end via <br>
    $('endBig').innerHTML = T.endBig.replace(/\n/g,'<br>');
    document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on', b.dataset.lang===LANG));
  }
  audio.src = SONG[LANG];
  applyLang();

  // ---- language toggle: switch ?lang= and reload ----
  document.querySelectorAll('#lang button').forEach(b=>{
    b.addEventListener('click',(e)=>{
      e.stopPropagation();
      const next = b.dataset.lang;
      if(next===LANG) return;
      const u = new URL(location.href); u.searchParams.set('lang', next);
      location.href = u.toString();
    });
  });

  // ---- build scenes (one per unique key) ----------------------------------
  const SVG_BLOOM = '';
  const built = {};
  let reelCells = [];
  function keyOf(type, ref){ return type + ':' + (ref||''); }

  function fighterHTML(fid, isMu){
    const f = T.fighters[fid];
    return '<div class="fighter'+(isMu?' mu':'')+'">'+
      '<div class="ficon">'+ICON[fid]+'</div>'+
      '<div class="fname">'+f.n+'</div>'+
      '<div class="fdesc">'+f.d+'</div></div>';
  }

  TL.forEach(([t,type,ref])=>{
    const k = keyOf(type, ref);
    if(built[k]) return; built[k] = true;
    const s = document.createElement('section');
    s.className = 'scene ' + type; s.dataset.k = k;

    if(type==='title'){
      s.innerHTML = '<div class="tk">'+T.sec.open+'</div>'+
        '<div class="tbig">'+ (LANG==='ja' ? 'MU<br>対<br>既存' : 'MU<br>vs<br>the giants') +'</div>'+
        '<div class="tsub">'+ (LANG==='ja' ? 'Amazon ・ メルカリ ・ ヤフオク' : 'Amazon · Mercari · eBay') +'</div>';
    }
    else if(type==='vs'){
      const R = ROUND[ref];
      s.innerHTML = '<div class="card'+(R.muwin?' muwin':'')+'">'+
        '<div class="round">'+T.rounds[R.round]+'</div>'+
        '<div class="matchup">'+
          fighterHTML(R.left, false)+
          '<div class="vsmid">VS</div>'+
          fighterHTML(R.mu, true)+
        '</div>'+
        '<div class="verdict '+T.verdicts[R.verdict].cls+'">'+T.verdicts[R.verdict].html+'</div>'+
      '</div>';
    }
    else if(type==='girl'){
      s.innerHTML = '<img src="girl3/'+ref+'.png" alt="">';
    }
    else if(type==='phone'){
      s.innerHTML = '<div class="frame"><div class="notch"></div><div class="scr"><img src="shots/'+ref+'.png" alt=""></div></div>';
    }
    else if(type==='reel'){
      const g = document.createElement('div'); g.className='reelgrid';
      for(let c=0;c<NCELL;c++){
        const cell=document.createElement('div'); cell.className='cell';
        const im=document.createElement('img'); im.src=PRODUCTS[c%NPROD];
        cell.appendChild(im); g.appendChild(cell); reelCells.push(im);
      }
      s.appendChild(g);
    }
    else if(type==='end'){
      // end uses the fixed overlay; this scene is just a transparent placeholder
      s.style.background='transparent';
    }
    stage.appendChild(s);
  });
  const scenes = [...stage.querySelectorAll('.scene')];

  // ---- sparkles ----
  const SP=[];
  for(let i=0;i<14;i++){ const d=document.createElement('div'); d.className='spk';
    d.style.fontSize=(11+(i%4)*5)+'px'; d.textContent='✦'; stage.appendChild(d); SP.push(d); }

  // ---- render frame -------------------------------------------------------
  let cur=-1;
  function apply(t){
    let i=0; for(let k=0;k<TL.length;k++) if(t>=TL[k][0]) i=k;
    const [st,type,ref,capKey,secKey] = TL[i];
    const key = keyOf(type, ref), local = t - st;

    if(i!==cur){ cur=i;
      scenes.forEach(s=>s.classList.toggle('on', s.dataset.k===key));
      const capHTML = capKey ? T.caps[capKey] : '';
      capInner.innerHTML = capHTML; capWrap.classList.toggle('on', !!capHTML);
      const secTxt = secKey ? T.sec[secKey] : '';
      secEl.textContent = secTxt; secEl.classList.toggle('on', !!secTxt);
      endEl.classList.toggle('on', type==='end');
    }

    // reel: real products swap fast (deterministic by time)
    if(type==='reel'){
      const step=Math.floor(t/0.16);
      for(let j=0;j<reelCells.length;j++){ const idx=(step*7 + j*11) % NPROD; reelCells[j].src=PRODUCTS[idx]; }
    }

    // beat / FX
    const beat = audio.paused ? 0 : Math.max(0, Math.exp(-((t*2)%1)*5)*0.92);
    root.style.setProperty('--beat', beat.toFixed(3));
    root.style.setProperty('--punch', (1 + Math.max(0, 0.07 - local*0.32)).toFixed(3));
    // gold flash on the deciding round (r3 first show) and the finish
    let fl = Math.max(0, 0.5 - local*2.6);
    root.style.setProperty('--flash', fl.toFixed(3));
    root.style.setProperty('--cappop', (1 + Math.max(0, 0.18 - local*0.9)).toFixed(3));

    for(let j=0;j<SP.length;j++){ const ph=j*1.7;
      const x=50 + 42*Math.sin(t*0.6 + ph), y=20 + 60*((Math.sin(t*0.4+ph*1.3)+1)/2);
      const op=(0.22 + 0.62*Math.max(0,Math.sin(t*2.2 + ph))) * (0.5+beat*0.6);
      SP[j].style.left=x+'%'; SP[j].style.top=y+'%'; SP[j].style.opacity=Math.min(1,op).toFixed(2);
      SP[j].style.transform='scale('+(0.6+0.6*Math.abs(Math.sin(t*1.5+ph)))+')';
    }
    prog.style.width=Math.min(100, t/dur*100)+'%';
  }

  function loop(){ apply(audio.currentTime); if(!audio.paused) requestAnimationFrame(loop); }

  startEl.addEventListener('click',()=>{
    audio.currentTime=0;
    audio.play().then(()=>{ startEl.classList.add('hide'); loop(); })
                .catch(()=>{ startEl.classList.add('hide'); apply(0); loop(); });
  });

  // ---- render/headless hook: paint a representative frame even without audio ----
  (function(){
    const qp = new URLSearchParams(location.search);
    if(qp.has('render')){
      startEl.classList.add('hide');
      window.__seek = (tt)=>apply(tt); window.__ready = true;
    }
    // headless screenshot: show the deciding ROUND 3 frame so the card is visible
    if(qp.has('shot')){
      startEl.classList.add('hide');
      apply( +(0.49*dur+0.4).toFixed(3) );
    }
  })();
})();
</script>
</body>
</html>
