<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>紙芝居『焚き火の約束』｜はじめての人へ＋Code of Conduct — 濱田優貴</title>
<meta name="robots" content="index,follow" />
<meta name="description" content="焚き火って、なに？ はじめての人がまず分かる入門と、覚える約束。LOVE & RESPECT・盛らない・湿った薪でもくべろ・可逆は速く不可逆は一呼吸。全8場面・本人声。">
<meta property="og:title" content="紙芝居『焚き火の約束』">
<meta property="og:description" content="焚き火って、なに？ はじめての人への入門と、覚える約束。全8場面・本人声。">
<meta property="og:image" content="https://yukihamada.jp/assets/kamishibai-v2/COC/scene5.png">
<meta name="theme-color" content="#0d0d0d">
<style>
  :root{ --ink:#ede8de; --dim:#9a958a; --bg:#0d0d0d; --accent:#e6953f; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;overflow:hidden}
  #stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #art{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}
  #art.show{opacity:1}
  #shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,13,13,.93) 0%,rgba(13,13,13,.25) 40%,rgba(13,13,13,.05) 62%,rgba(13,13,13,.4) 100%)}
  #cap{position:absolute;left:0;right:0;bottom:0;padding:30px 7vw 42px;text-align:center}
  #scene-sub{font-size:13px;letter-spacing:.34em;color:var(--accent);margin-bottom:9px;font-family:"Hiragino Kaku Gothic ProN",sans-serif}
  #scene-title{font-size:clamp(24px,4.2vw,46px);font-weight:600;letter-spacing:.06em;text-shadow:0 2px 18px rgba(0,0,0,.85);margin-bottom:15px}
  #scene-text{font-size:clamp(14px,1.7vw,20px);line-height:1.95;max-width:860px;margin:0 auto;text-shadow:0 1px 10px rgba(0,0,0,.9);opacity:.94}
  #scene-link{display:none;margin-top:16px;padding:12px 32px;border:1px solid var(--accent);color:var(--accent);letter-spacing:.16em;font-size:15px;border-radius:3px;text-decoration:none;font-family:"Hiragino Kaku Gothic ProN",sans-serif}
  #scene-link.show{display:inline-block}
  #progress{position:absolute;top:0;left:0;height:3px;background:var(--accent);width:0%;transition:width .4s linear;opacity:.85}
  #dots{position:absolute;top:16px;right:20px;font-size:12px;letter-spacing:.3em;color:var(--dim);font-family:sans-serif}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--bg);z-index:5;transition:opacity .9s}
  #title.hide{opacity:0;pointer-events:none}
  #title .circle{width:80px;height:80px;border:3px solid var(--ink);border-radius:50%}
  #title h1{font-size:clamp(26px,4.6vw,52px);letter-spacing:.12em;font-weight:600;text-align:center}
  #title p{color:var(--dim);letter-spacing:.22em;font-size:13px;font-family:"Hiragino Kaku Gothic ProN",sans-serif;text-align:center;padding:0 20px}
  #title .start{margin-top:12px;padding:14px 44px;border:1px solid var(--accent);color:var(--accent);letter-spacing:.4em;font-size:15px;border-radius:2px;font-family:"Hiragino Kaku Gothic ProN",sans-serif}
  #invite{position:absolute;left:0;right:0;bottom:96px;display:none;justify-content:center;opacity:0;transition:opacity 1.6s ease}
  #invite.show{display:flex;opacity:1}
  #invite a{padding:11px 26px;border:1px solid rgba(230,149,63,.55);color:var(--accent);font-size:13px;letter-spacing:.14em;border-radius:3px;text-decoration:none;background:rgba(13,13,13,.55);font-family:"Hiragino Kaku Gothic ProN",sans-serif}
  #hint{position:absolute;bottom:12px;right:18px;color:var(--dim);font-size:11px;letter-spacing:.2em;font-family:sans-serif;opacity:.65}
</style>
<script defer src="https://enabler-analytics.fly.dev/t.js"></script>
</head>
<body>
<div id="stage">
  <div id="art"></div><div id="shade"></div>
  <div id="progress"></div><div id="dots"></div>
  <div id="cap">
    <div id="scene-sub"></div><div id="scene-title"></div><div id="scene-text"></div>
    <a id="scene-link" target="_blank" rel="noopener"></a>
  </div>
  <div id="title">
    <div class="circle"></div>
    <h1>焚き火の約束</h1>
    <p>紙芝居 ・ はじめての人へ ＋ 約束（Code of Conduct）・ 2026.06<br>声：濱田優貴（AIクローン）</p>
    <div style="margin-top:2px;font-size:12px;letter-spacing:.1em;color:#e6953f;font-family:sans-serif;line-height:1.7">🔊 声が流れます ・ iPhoneは「マナーモード（消音）」を解除してね</div>
    <div class="start">タップで、はじまる</div>
  </div>
  <div id="invite"><a href="https://atsm.wtf" target="_blank" rel="noopener">🔥 焚き火は、ここにあります — 火を囲みに</a></div>
<div id="hint">クリック＝次へ ／ ←戻る</div>
</div>
<script>
const SCENES=[
 {"sub":"ようこそ","title":"焚き火へ。","text":"ここは、初めての人にこそ来てほしい場所。","img":"/assets/kamishibai-v2/COC/scene1.png","audio":"/audio/v2/coc-kam-1.mp3","buy":"","cta":""},
 {"sub":"ここは何","title":"返ってくる場所。","text":"ここに来ると、何かが返ってくる。100人で囲む、小さな焚き火。","img":"/assets/kamishibai-v2/COC/scene2.png","audio":"/audio/v2/coc-kam-2.mp3","buy":"","cta":""},
 {"sub":"薪をくべる","title":"一言が、薪。","text":"作ったこと、詰まったこと。それを一言流すのが薪。火が、燃える。","img":"/assets/kamishibai-v2/COC/scene3.png","audio":"/audio/v2/coc-kam-3.mp3","buy":"","cta":""},
 {"sub":"火は持ち回り","title":"火を、絶やすな。","text":"今日、温まったら。明日は、誰かを温める。火を守るのは、持ち回り。","img":"/assets/kamishibai-v2/COC/scene4.png","audio":"/audio/v2/coc-kam-4.mp3","buy":"","cta":""},
 {"sub":"土台","title":"LOVE & RESPECT","text":"人を好きでいる。作る人を、尊重する。ここから全部が燃えている。覚えるのは、これだけでいい。","img":"/assets/kamishibai-v2/COC/scene5.png","audio":"/audio/v2/coc-kam-5.mp3","buy":"","cta":""},
 {"sub":"刺すのは作品","title":"人は、刺さない。","text":"率直でいい。でも、矛先はいつも作品へ。炎上とは、違う。","img":"/assets/kamishibai-v2/COC/scene6.png","audio":"/audio/v2/coc-kam-6.mp3","buy":"","cta":""},
 {"sub":"正直に","title":"盛らない。沈黙しない。","text":"数字も、しくじりも、そのまま。すごいね、で終わらせない。違和感の一言が、宝。湿った薪でも、くべていい。","img":"/assets/kamishibai-v2/COC/scene7.png","audio":"/audio/v2/coc-kam-7.mp3","buy":"","cta":""},
 {"sub":"結","title":"戻せないだけ、ひと呼吸。","text":"戻せるなら、どんどんやれ。戻せないことだけ、ひと呼吸。最後のスイッチは、人が押す。","img":"/assets/kamishibai-v2/COC/scene8.png","audio":"/audio/v2/coc-kam-8.mp3","buy":"https://atsm.wtf","cta":"🔥 atsm.wtf で、火を囲む"}
];
let idx=-1, started=false;
let actx=null, abuf={}, asrc=null;
SCENES.forEach(s=>{ const i=new Image(); i.src=s.img; });

function unlock(){
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  try{ const b=actx.createBuffer(1,1,22050), s=actx.createBufferSource(); s.buffer=b; s.connect(actx.destination); s.start(0);}catch(_){}
  if(actx.state==='suspended') actx.resume();
}
async function playAudio(i){
  if(asrc){ try{asrc.onended=null; asrc.stop();}catch(_){} asrc=null; }
  const url=SCENES[i].audio;
  try{
    if(!abuf[url]){ const r=await fetch(url); const ab=await r.arrayBuffer(); abuf[url]=await actx.decodeAudioData(ab); }
    if(idx!==i) return;
    asrc=actx.createBufferSource(); asrc.buffer=abuf[url]; asrc.connect(actx.destination);
    asrc.onended=()=>{ if(idx===i && idx<SCENES.length-1) setTimeout(()=>play(idx+1),900); else if(idx===i && idx===SCENES.length-1) setTimeout(showInvite,1200); };
    asrc.start(0);
  }catch(e){ /* autoplay/codec fallback: just hold the scene */ }
}
function showInvite(){
  try{ if(localStorage.getItem('kmb_coc_invite_seen')) return; localStorage.setItem('kmb_coc_invite_seen','1'); }catch(_){ return }
  document.getElementById('invite').classList.add('show');
}
function play(i){
  if(i<0||i>=SCENES.length) return;
  idx=i; const s=SCENES[i];
  const art=document.getElementById('art');
  art.classList.remove('show');
  setTimeout(()=>{ art.style.backgroundImage="url('"+s.img+"')"; art.classList.add('show'); },350);
  document.getElementById('scene-sub').textContent=s.sub||'';
  document.getElementById('scene-title').textContent=s.title;
  document.getElementById('scene-text').textContent=s.text;
  const link=document.getElementById('scene-link');
  if(s.buy){ link.href=s.buy; link.textContent=s.cta||'→ ひらく'; link.classList.add('show'); }
  else link.classList.remove('show');
  document.getElementById('dots').textContent=(i+1)+' / '+SCENES.length;
  document.getElementById('progress').style.width=(((i+1)/SCENES.length)*100)+'%';
  playAudio(i);
}
document.getElementById('scene-link').addEventListener('click',e=>e.stopPropagation());
document.getElementById('stage').addEventListener('click',()=>{
  if(!started){ started=true; unlock(); document.getElementById('title').classList.add('hide'); play(0); return; }
  if(idx<SCENES.length-1) play(idx+1);
});
document.addEventListener('keydown',e=>{
  if(!started){ started=true; unlock(); document.getElementById('title').classList.add('hide'); play(0); return; }
  if((e.key==='ArrowRight'||e.key===' ')&&idx<SCENES.length-1) play(idx+1);
  if(e.key==='ArrowLeft'&&idx>0) play(idx-1);
});
</script>
</body>
</html>
