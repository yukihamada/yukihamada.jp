<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — このページは無 · 濱田優貴</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="https://enabler-analytics.fly.dev/t.js" defer></script>
  <script async src="https://umami-analytics.fly.dev/script.js" data-website-id="00000000-0000-0000-0000-000000000000"></script>
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a href="/" class="nav-logo">YH</a>
  </div>
</nav>

<main class="section" style="min-height:78vh; display:flex; align-items:center; justify-content:center;">
  <div style="max-width:400px; width:100%; text-align:center;">
    <h1 style="font-size:4rem; font-weight:700; opacity:0.22; line-height:1; margin-bottom:.4rem;">404</h1>
    <p style="margin:0 0 .2rem; font-weight:600;">このページは <em>無</em> でした。</p>
    <p style="margin:0 0 1rem; font-size:.72rem; opacity:.4; word-break:break-all;"><code>__PATH__</code></p>

    <!-- 悪魔が一言（本人クローン声・WebAudioでiOSサイレントでも鳴る） -->
    <div style="margin:0 0 1.4rem; padding:14px 16px; border-left:2px solid #e8651f; background:rgba(232,101,31,.05); text-align:left; border-radius:0 8px 8px 0;">
      <p style="margin:0; font-size:.86rem; line-height:1.8;">「おや、迷子かい。探していたものは、無かった。……でも、それもまた、答えだよ。」</p>
      <button id="akuma-voice" type="button"
        style="margin-top:10px; background:none; border:0; padding:0; color:#e8651f; font:inherit; font-size:.78rem; font-weight:600; cursor:pointer;">
        🔊 悪魔の声で聞く
      </button>
    </div>

    <!-- 迷子レスキュー（サーバーが曖昧マッチで候補を差し込む） -->
    <div style="text-align:left; margin:0 0 1.4rem;">
      <div style="font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; opacity:.45; margin-bottom:8px;">もしかして</div>
      <div style="display:flex; flex-direction:column; gap:6px;">__SUGGEST__</div>
    </div>

    <!-- 生きてる焚き火（/api/community/posts をライブで） -->
    <a id="fire404" href="/tomoshibi" style="display:block; text-decoration:none; color:inherit; font-size:.84rem; margin:0 0 1.5rem; padding:11px 14px; border:1px solid rgba(232,101,31,.25); border-radius:8px; background:rgba(232,101,31,.04); opacity:0; transition:opacity .4s;">🔥 焚き火へ</a>

    <!-- 404＝無。その「無」をTシャツにした実物（MU／wearmu.com） -->
    <a href="https://wearmu.com/shop/MULAB-AGENT-TEE-0a63263c" target="_blank" rel="noopener"
       style="display:block; text-decoration:none; color:inherit; border:1px solid rgba(0,0,0,.1); border-radius:10px; overflow:hidden; background:#faf9f6; box-shadow:0 10px 30px rgba(0,0,0,.06); transition:transform .15s ease, box-shadow .15s ease;"
       onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 16px 40px rgba(0,0,0,.12)'"
       onmouseout="this.style.transform='none';this.style.boxShadow='0 10px 30px rgba(0,0,0,.06)'">
      <img src="https://mockups.wearmu.com/catalog/mockups/MULAB-AGENT-TEE-0a63263c.png"
           alt="404＝無 Tシャツ" loading="lazy"
           style="display:block; width:100%; aspect-ratio:1/1; object-fit:cover; background:#f0efea;">
      <div style="padding:16px 18px; text-align:left;">
        <div style="font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; opacity:.5; margin-bottom:6px;">MU · wearmu.com</div>
        <div style="font-weight:600; font-size:.92rem; line-height:1.5;">404＝無。MUの一番きれいなジョーク。</div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:14px;">
          <span style="font-weight:700;">¥4,900</span>
          <span style="font-size:.8rem; font-weight:600; color:#e8651f;">このページを着る →</span>
        </div>
      </div>
    </a>

    <div style="margin-top:1.6rem;">
      <a href="/" class="btn btn-outline">ホームに戻る</a>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <p class="footer-muted">&copy; 2026 Yuki Hamada</p>
  </div>
</footer>

<script>
// 悪魔の声 — 同一オリジンmp3をWebAudioで（iPhoneサイレントスイッチでも鳴る／ユーザー操作内で解錠）
(function(){
  var btn=document.getElementById('akuma-voice'); if(!btn) return;
  var actx, buf;
  btn.addEventListener('click', async function(){
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended') await actx.resume();
      if(!buf){ var r=await fetch('/audio/404-akuma.mp3'); buf=await actx.decodeAudioData(await r.arrayBuffer()); }
      var s=actx.createBufferSource(); s.buffer=buf; s.connect(actx.destination); s.start(0);
      btn.textContent='🔥 …';
    }catch(e){ btn.style.display='none'; }
  });
})();
// 生きてる焚き火
(function(){
  var el=document.getElementById('fire404'); if(!el) return;
  fetch('/api/community/posts',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    var n=d.count||0;
    el.innerHTML = (d.fire_alive && n>0)
      ? '🔥 いま薪 <b>'+n+'</b> 本、燃えてる — あたっていく?'
      : '🔥 焚き火はいま静か — のぞいてみる?';
    el.style.opacity=1;
  }).catch(function(){ el.innerHTML='🔥 焚き火へ'; el.style.opacity=1; });
})();
</script>

</body>
</html>
