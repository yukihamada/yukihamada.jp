const SCENES=[{"sub": "二〇一七年", "title": "注意こそ、すべて。", "text": "いま、あなたと話している、この声も。たった一行の題名から、生まれました。注意こそ、すべて。……たった一つの工夫で、機械は、言葉の意味を、つかみはじめた。", "img": "/assets/kamishibai-v2/EP7/scene1.png", "audio": "/audio/v2/transformer-kam-1.mp3", "buy": "", "cta": ""}, {"sub": "むかし", "title": "順番待ちで、遅い。", "text": "むかしの機械は、文章を、左から一語ずつ、順番に読んでいました。前の言葉を覚えながら、次へ。次へ。……でも、文が長くなるほど、最初のほうを、忘れていく。しかも、順番待ち。だから、どうしても、遅い。", "img": "/assets/kamishibai-v2/EP7/scene2.png", "audio": "/audio/v2/transformer-kam-2.mp3", "buy": "", "cta": "", "dgm": "seq"}, {"sub": "ひらめき", "title": "机の上に、ぜんぶ広げる。", "text": "そこで、彼らは、発想を、ひっくり返した。順番に読むのを、やめる。文の中の言葉を、ぜんぶ、いちどに、机の上へ、広げてしまう。あとは——どの言葉と、どの言葉が、深くつながっているか。それを、見つければいい。", "img": "/assets/kamishibai-v2/EP7/scene3.png", "audio": "/audio/v2/transformer-kam-3.mp3", "buy": "", "cta": "", "dgm": "spread"}, {"sub": "アテンション", "title": "どこを見るか、自分で決める。", "text": "たとえば。犬が、骨を、くわえた。それを、離さない。……この『それ』は、骨のこと。どうして、わかる? 一つ一つの言葉が、文じゅうのすべての言葉を見渡して、いちばん関係の強い相手を、強く見るから。どこを見るかを、自分で決める。これが、注意。アテンションです。", "img": "/assets/kamishibai-v2/EP7/scene4.png", "audio": "/audio/v2/transformer-kam-4.mp3", "buy": "", "cta": "", "dgm": "attn"}, {"sub": "しくみ", "title": "似ているものに、惹かれる。", "text": "では、見る強さは、どう決まるのか。三つの役。知りたいことを、問いにする。それぞれの言葉が、わたしはこれ、と名札をかかげる。問いと名札が、似ているほど、中身をたくさん受け取って、ぜんぶ足す。似ているものに、惹かれる。——人と、おなじです。むずかしい計算は、ぜんぶ機械にまかせていい。それだけ。", "img": "/assets/kamishibai-v2/EP7/scene5.png", "audio": "/audio/v2/transformer-kam-5.mp3", "buy": "", "cta": "", "dgm": "qkv"}, {"sub": "複数の目", "title": "一人で、見ない。", "text": "さっきの、犬と骨を、覚えていますか。あれを見ていた目は、一組じゃない。文法を見る目。意味を見る目。遠くの言葉を、見る目。機械は、何組もの目で、同時に、ちがう角度から、おなじ文を見つめる。一人で、見ない。これを、複数の頭、マルチヘッドと呼びます。", "img": "/assets/kamishibai-v2/EP7/scene6.png", "audio": "/audio/v2/transformer-kam-6.mp3", "buy": "", "cta": "", "dgm": "multi"}, {"sub": "順番の情報", "title": "波の印を、そっと足す。", "text": "でも、順番を捨てると、前後が、わからなくなる。だから、それぞれの言葉に、何番目かを、なめらかな波の印で、そっと足す。ただの番号なら、ばらばらの記号。でも波なら、近い席どうしは、形まで似る。だから、近い・遠いが、伝わる。広げたまま、順番も、ちゃんと残るんです。", "img": "/assets/kamishibai-v2/EP7/scene7.png", "audio": "/audio/v2/transformer-kam-7.mp3", "buy": "", "cta": "", "dgm": "pos"}, {"sub": "結果", "title": "順番待ちが、消えた。", "text": "そして、あの順番待ちが、消えた。何千もの言葉を、いちどに学べる。学習は、ぐんと速くなる。翻訳の正しさは、それまでの最高記録を、塗り替えた。順番待ちが、消えた。たった、それだけのことが、すべてを変えた。この仕組みを——トランスフォーマー、と呼びます。", "img": "/assets/kamishibai-v2/EP7/scene8.png", "audio": "/audio/v2/transformer-kam-8.mp3", "buy": "", "cta": "", "dgm": "result"}, {"sub": "それから", "title": "あの題名は、ほんとうだった。", "text": "この、小さな一本の論文が、土台になりました。チャットGPTも。いま、あなたと話している、この声も。ぜんぶ、ここから生まれた。冒頭の言葉を、覚えていますか。注意こそ、すべて。……あの題名は、ほんとうでした。", "img": "/assets/kamishibai-v2/EP7/scene9.png", "audio": "/audio/v2/transformer-kam-9.mp3", "buy": "", "cta": ""}, {"sub": "きみへ", "title": "さいごに、一曲。", "text": "むずかしい計算は、ぜんぶ機械にまかせていい。だいじなのは、きみが、何をつくりたいか。どこを見るかを決める力は、機械にも——きみにも、ある。この仕組みは、もう、誰でもさわれます。きみのことばが、つぎの何かを、動かすかもしれない。……さいごに、一曲。どうぞ。", "img": "/assets/kamishibai-v2/EP7/scene10.png", "audio": "/audio/v2/transformer-kam-10.mp3", "buy": "", "cta": "", "mv": true}];
let idx=-1, started=false;
let actx=null, abuf={}, asrc=null;
SCENES.forEach(s=>{ const i=new Image(); i.src=s.img; });

function unlock(){
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  try{ const b=actx.createBuffer(1,1,22050), s=actx.createBufferSource(); s.buffer=b; s.connect(actx.destination); s.start(0);}catch(_){}
  if(actx.state==='suspended') actx.resume();
}
async function playAudio(i){
  if(asrc){ try{asrc.onended=null; asrc.stop();}catch(_){} asrc=null; }
  const url=SCENES[i].audio;
  try{
    if(!abuf[url]){ const r=await fetch(url); const ab=await r.arrayBuffer(); abuf[url]=await actx.decodeAudioData(ab); }
    if(idx!==i) return;
    asrc=actx.createBufferSource(); asrc.buffer=abuf[url]; asrc.connect(actx.destination);
    asrc.onended=()=>{ if(idx===i && idx<SCENES.length-1) setTimeout(()=>play(idx+1),900);
                       else if(idx===i && SCENES[i].mv) setTimeout(openMV,1400); };
    asrc.start(0);
  }catch(e){ /* autoplay/codec fallback: hold the scene */ }
}
function play(i){
  if(i<0||i>=SCENES.length) return;
  idx=i; const s=SCENES[i];
  const art=document.getElementById('art');
  const cap=document.getElementById('cap');
  art.classList.remove('show');
  cap.classList.remove('in');
  setTimeout(()=>{
    if(idx!==i) return;
    art.style.backgroundImage="url('"+s.img+"')"; art.classList.add('show');
    document.getElementById('scene-sub').textContent=s.sub||'';
    document.getElementById('scene-title').textContent=s.title;
    document.getElementById('scene-text').textContent=s.text;
    cap.classList.add('in');
  },350);
  const dg=document.getElementById('diagram');
  if(s.dgm && DIAG[s.dgm]){ dg.innerHTML=DIAG[s.dgm]; dg.classList.add('show'); }
  else { dg.classList.remove('show'); setTimeout(()=>{ if(!SCENES[idx]||!SCENES[idx].dgm) dg.innerHTML=''; },500); }
  const link=document.getElementById('scene-link');
  if(s.cta){ link.textContent=s.cta; link.classList.add('show'); }
  else link.classList.remove('show');
  document.getElementById('dots').textContent=(i+1)+' / '+SCENES.length;
  document.getElementById('progress').style.width=(((i+1)/SCENES.length)*100)+'%';
  playAudio(i);
}
function openMV(){
  const f=document.getElementById('mv-frame');
  if(!f.src) f.src="/mv/tap.html";
  document.getElementById('mv').classList.add('show');
  if(asrc){ try{asrc.onended=null; asrc.stop();}catch(_){} asrc=null; }
}
function closeMV(){ document.getElementById('mv').classList.remove('show'); }
document.getElementById('scene-link').addEventListener('click',e=>{ e.stopPropagation(); openMV(); });
document.getElementById('mv-close').addEventListener('click',e=>{ e.stopPropagation(); closeMV(); });
document.getElementById('stage').addEventListener('click',()=>{
  if(!started){ started=true; unlock(); document.getElementById('title').classList.add('hide'); play(0); return; }
  if(idx<SCENES.length-1) play(idx+1);
});
document.addEventListener('keydown',e=>{
  if(document.getElementById('mv').classList.contains('show')){ if(e.key==='Escape') closeMV(); return; }
  if(!started){ started=true; unlock(); document.getElementById('title').classList.add('hide'); play(0); return; }
  if((e.key==='ArrowRight'||e.key===' ')&&idx<SCENES.length-1) play(idx+1);
  if(e.key==='ArrowLeft'&&idx>0) play(idx-1);
});
</script>
