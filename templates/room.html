<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>オンライン会議室 — 濱田優貴</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --amber: #e8a04c; --bg: #08080a; --panel: #121216; --text: #f4f1ea; --muted: #9a958c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .moon {
      width: 26px; height: 26px; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #fff6e8, var(--amber) 60%, #b97a2e);
      box-shadow: 0 0 0 1px rgba(232,160,76,.4), 0 4px 18px rgba(232,160,76,.4);
      flex: none;
    }
    header h1 { font-size: 1rem; font-weight: 700; margin: 0; letter-spacing: .02em; }
    header .sub { color: var(--muted); font-size: .8rem; margin-left: auto; }

    .stage {
      position: relative; flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    #remote {
      width: 100%; height: 100%; object-fit: contain;
      background: #000; border-radius: 16px;
    }
    /* local self-view, picture-in-picture corner */
    #local {
      position: absolute; right: 28px; bottom: 28px;
      width: 26vw; max-width: 220px; min-width: 120px; aspect-ratio: 4/3;
      object-fit: cover; border-radius: 12px; transform: scaleX(-1);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 8px 30px rgba(0,0,0,.5); background: #000; z-index: 3;
    }

    /* waiting / status overlay */
    .overlay {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; text-align: center; padding: 24px;
      background: radial-gradient(circle at center, rgba(232,160,76,.10), transparent 60%);
      transition: opacity .4s;
    }
    .overlay .moon-big {
      width: 80px; height: 80px; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #fff6e8, var(--amber) 60%, #b97a2e);
      box-shadow: 0 0 0 1px rgba(232,160,76,.4), 0 12px 50px rgba(232,160,76,.5);
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .82; } }
    .overlay h2 { margin: 0; font-size: 1.3rem; font-weight: 700; }
    .overlay p { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.7; max-width: 360px; }
    .overlay .link-btn {
      margin-top: 4px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
      color: var(--text); padding: 10px 18px; border-radius: 999px; font-size: .86rem; cursor: pointer;
    }
    .overlay .link-btn:active { transform: scale(.97); }
    .overlay[hidden] { display: none; }

    /* controls bar */
    .controls {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    .ctl {
      width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16);
      background: var(--panel); color: var(--text); font-size: 1.25rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: .15s;
    }
    .ctl:hover { background: #1b1b20; }
    .ctl.off { background: #3a2326; border-color: #6b3a3f; color: #ff9a9a; }
    .ctl.leave { background: #c0392b; border-color: #c0392b; color: #fff; width: 64px; }
    .ctl.leave:hover { background: #d8463a; }

    .ended { text-align: center; padding: 40px 24px; margin: auto; }
    .ended h2 { font-weight: 700; }
    .ended a { color: var(--amber); }
  </style>
</head>
<body>
  <header>
    <div class="moon"></div>
    <h1>濱田優貴 ミーティング</h1>
    <span class="sub" id="status">接続中…</span>
  </header>

  <div class="stage" id="stage">
    <video id="remote" autoplay playsinline></video>
    <video id="local" autoplay playsinline muted></video>

    <div class="overlay" id="overlay">
      <div class="moon-big"></div>
      <h2 id="ov-title">相手の参加を待っています</h2>
      <p id="ov-text">このページを開いたままお待ちください。相手が同じURLを開くと、自動的につながります。</p>
      <button class="link-btn" id="copy-link">招待リンクをコピー</button>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="ctl" id="btn-mic" title="マイク">🎤</button>
    <button class="ctl" id="btn-cam" title="カメラ">🎥</button>
    <button class="ctl leave" id="btn-leave" title="退出">📴</button>
  </div>

  <script>
  (function () {
    const room = (location.pathname.split('/').filter(Boolean).pop() || '').slice(0, 64);
    const ICE = { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
    ] };

    const remoteV = document.getElementById('remote');
    const localV  = document.getElementById('local');
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');
    const ovTitle = document.getElementById('ov-title');
    const ovText  = document.getElementById('ov-text');

    let myId = null, pc = null, localStream = null, ws = null;
    let connected = false;

    function setStatus(t) { statusEl.textContent = t; }
    function showOverlay(title, text) {
      if (title) ovTitle.textContent = title;
      if (text) ovText.textContent = text;
      overlay.hidden = false;
    }
    function hideOverlay() { overlay.hidden = true; }

    document.getElementById('copy-link').onclick = async () => {
      try { await navigator.clipboard.writeText(location.href);
        document.getElementById('copy-link').textContent = 'コピーしました ✓';
      } catch (_) {}
    };

    function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

    function newPC() {
      pc = new RTCPeerConnection(ICE);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      pc.ontrack = (e) => {
        remoteV.srcObject = e.streams[0];
        connected = true; hideOverlay(); setStatus('通話中');
      };
      pc.onicecandidate = (e) => { if (e.candidate) send({ t: 'candidate', candidate: e.candidate }); };
      pc.onconnectionstatechange = () => {
        const s = pc.connectionState;
        if (s === 'connected') { setStatus('通話中'); }
        else if (s === 'disconnected' || s === 'failed') {
          if (connected) showOverlay('再接続を試みています…', 'ネットワークが不安定です。少しお待ちください。');
          setStatus('再接続中…');
        }
      };
      return pc;
    }

    async function init() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      } catch (err) {
        showOverlay('カメラ / マイクを使えません', 'ブラウザの権限を許可してから再読み込みしてください。');
        setStatus('権限エラー');
        return;
      }
      localV.srcObject = localStream;

      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/room/${room}`);

      ws.onopen = () => setStatus('相手を待っています');
      ws.onclose = () => { if (!connected) setStatus('切断されました'); };

      ws.onmessage = async (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch (_) { return; }

        if (m.t === 'hello') { myId = m.id; return; }

        if (m.t === 'join') {
          // Tie-break: the lower peer id sends the offer (avoids glare).
          if (myId != null && myId < m.from) {
            if (!pc) newPC();
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            send({ t: 'offer', sdp: pc.localDescription });
          }
          return;
        }
        if (m.t === 'offer') {
          if (!pc) newPC();
          await pc.setRemoteDescription(m.sdp);
          const ans = await pc.createAnswer();
          await pc.setLocalDescription(ans);
          send({ t: 'answer', sdp: pc.localDescription });
          return;
        }
        if (m.t === 'answer') {
          if (pc) await pc.setRemoteDescription(m.sdp);
          return;
        }
        if (m.t === 'candidate') {
          if (pc && m.candidate) { try { await pc.addIceCandidate(m.candidate); } catch (_) {} }
          return;
        }
        if (m.t === 'leave') {
          if (pc) { pc.close(); pc = null; }
          remoteV.srcObject = null; connected = false;
          showOverlay('相手が退出しました', '同じURLを開けば、もう一度つなぎ直せます。');
          setStatus('相手を待っています');
          return;
        }
      };
    }

    // ── Controls ──
    document.getElementById('btn-mic').onclick = function () {
      if (!localStream) return;
      const on = localStream.getAudioTracks().some(t => (t.enabled = !t.enabled));
      this.classList.toggle('off', !on); this.textContent = on ? '🎤' : '🔇';
    };
    document.getElementById('btn-cam').onclick = function () {
      if (!localStream) return;
      const on = localStream.getVideoTracks().some(t => (t.enabled = !t.enabled));
      this.classList.toggle('off', !on); this.textContent = on ? '🎥' : '🚫';
      localV.style.visibility = on ? 'visible' : 'hidden';
    };
    document.getElementById('btn-leave').onclick = function () {
      try { send({ t: 'leave' }); } catch (_) {}
      if (pc) pc.close();
      if (ws) ws.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      document.getElementById('stage').innerHTML =
        '<div class="ended"><div class="moon-big" style="margin:0 auto 18px"></div>' +
        '<h2>通話を終了しました</h2><p style="color:var(--muted)">' +
        'ご参加ありがとうございました。<br><a href="/meet">日程をもう一度選ぶ</a></p></div>';
      document.getElementById('controls').style.display = 'none';
      setStatus('終了');
    };

    if (!room) { showOverlay('会議室が見つかりません', 'リンクをもう一度ご確認ください。'); }
    else init();
  })();
  </script>
</body>
</html>
