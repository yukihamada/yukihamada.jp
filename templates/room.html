<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>オンライン会議室 — 濱田優貴</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --amber: #e8a04c; --bg: #08080a; --panel: #121216; --text: #f4f1ea; --muted: #9a958c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      /* campfire wallpaper — warm glow rising from the bottom, ties the room to ともしび */
      background:
        radial-gradient(58% 46% at 50% 104%, rgba(255,170,70,.30), transparent 70%),
        radial-gradient(90% 70% at 50% 100%, rgba(232,101,31,.22), transparent 72%),
        radial-gradient(120% 90% at 50% 26%, transparent 42%, rgba(0,0,0,.55) 100%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .moon {
      width: 26px; height: 26px; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #fff6e8, var(--amber) 60%, #b97a2e);
      box-shadow: 0 0 0 1px rgba(232,160,76,.4), 0 4px 18px rgba(232,160,76,.4);
      flex: none;
    }
    header h1 { font-size: 1rem; font-weight: 700; margin: 0; letter-spacing: .02em; }
    header .sub { color: var(--muted); font-size: .8rem; margin-left: auto; }

    .stage { position: relative; flex: 1; min-height: 0; padding: 14px; }

    /* video grid — auto-fits 1..6 tiles */
    .grid {
      display: grid; gap: 10px; width: 100%; height: 100%;
      grid-template-columns: 1fr; align-content: center;
    }
    .grid.n2 { grid-template-columns: 1fr 1fr; }
    .grid.n3, .grid.n4 { grid-template-columns: 1fr 1fr; }
    .grid.n5, .grid.n6 { grid-template-columns: 1fr 1fr 1fr; }
    @media (max-width: 640px) {
      .grid.n3, .grid.n4, .grid.n5, .grid.n6 { grid-template-columns: 1fr 1fr; }
    }
    .tile {
      position: relative; background: #000; border-radius: 14px; overflow: hidden;
      min-height: 0; aspect-ratio: 4/3; border: 1px solid rgba(255,255,255,.08);
    }
    .tile.solo { aspect-ratio: auto; height: 100%; }
    .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile .name {
      position: absolute; left: 10px; bottom: 8px; z-index: 2;
      font-size: .74rem; color: #fff; background: rgba(0,0,0,.5);
      padding: 3px 9px; border-radius: 999px; backdrop-filter: blur(4px);
    }
    .tile.me video { transform: scaleX(-1); }
    .tile.connecting::after {
      content: "接続中…"; position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center; color: var(--muted); font-size: .85rem;
    }

    /* waiting overlay (only when alone) */
    .overlay {
      position: absolute; inset: 14px; z-index: 5; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; text-align: center; padding: 24px;
      background: rgba(8,8,10,.42);
      background-image: radial-gradient(circle at 50% 120%, rgba(232,101,31,.28), transparent 60%);
      backdrop-filter: blur(2px);
    }
    .overlay .moon-big {
      width: 76px; height: 76px; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #fff6e8, var(--amber) 60%, #b97a2e);
      box-shadow: 0 0 0 1px rgba(232,160,76,.4), 0 12px 50px rgba(232,160,76,.5);
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .82; } }
    .overlay h2 { margin: 0; font-size: 1.25rem; font-weight: 700; }
    .overlay p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.7; max-width: 360px; }
    .overlay .link-btn {
      margin-top: 4px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
      color: var(--text); padding: 10px 18px; border-radius: 999px; font-size: .86rem; cursor: pointer;
      text-decoration: none; display: inline-block;
    }
    .overlay .link-btn.fire { background: rgba(232,101,31,.16); border-color: rgba(232,101,31,.45); color: #ffd9a8; }
    .overlay[hidden] { display: none; }

    .controls {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    .ctl {
      width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16);
      background: var(--panel); color: var(--text); font-size: 1.25rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: .15s;
    }
    .ctl:hover { background: #1b1b20; }
    .ctl.off { background: #3a2326; border-color: #6b3a3f; color: #ff9a9a; }
    .ctl.leave { background: #c0392b; border-color: #c0392b; color: #fff; width: 64px; }
    .ctl.leave:hover { background: #d8463a; }

    .ended { text-align: center; padding: 40px 24px; margin: auto; }
    .ended a { color: var(--amber); }

    /* screen-share: don't mirror or crop the shared screen */
    .tile.screen video { transform: none; object-fit: contain; background: #000; }
    .ctl .badge {
      position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px;
      background: #c0392b; color: #fff; border-radius: 999px; font-size: .66rem;
      display: flex; align-items: center; justify-content: center; padding: 0 4px;
    }
    .ctl { position: relative; }

    /* chat side panel */
    .chat {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 86vw); z-index: 20;
      background: var(--panel); border-left: 1px solid rgba(255,255,255,.1);
      display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,.5);
    }
    .chat[hidden] { display: none; }
    .chat-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.08); font-weight: 700;
    }
    .chat-head button { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; }
    .chat-log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { font-size: .9rem; line-height: 1.5; }
    .msg .who { color: var(--amber); font-size: .76rem; font-weight: 700; }
    .msg.me .who { color: #7ec8ff; }
    .msg .body { color: var(--text); word-break: break-word; }
    .chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(255,255,255,.08); }
    .chat-form input {
      flex: 1; background: #0c0c0f; border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
      color: var(--text); padding: 10px 14px; font-size: .9rem; outline: none;
    }
    .chat-form button {
      background: var(--amber); border: none; color: #1a1206; border-radius: 999px;
      padding: 0 16px; font-weight: 700; cursor: pointer;
    }
  </style>
<script defer src="https://enabler-analytics.fly.dev/t.js"></script>
</head>
<body>
  <header>
    <div class="moon"></div>
    <h1>濱田優貴 ミーティング</h1>
    <span class="sub" id="status">接続中…</span>
  </header>

  <div class="stage" id="stage">
    <div class="grid" id="grid">
      <div class="tile me solo" id="tile-me">
        <video id="local" autoplay playsinline muted></video>
        <span class="name">あなた</span>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="moon-big"></div>
      <h2 id="ov-title">参加者を待っています</h2>
      <p id="ov-text">このページを開いたままお待ちください。同じURLを開いた人が、自動的に会議に加わります。（最大6人）</p>
      <button class="link-btn" id="copy-link">招待リンクをコピー</button>
      <a class="link-btn fire" id="to-fire" href="/community" hidden>🔥 焚き火に戻る</a>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="ctl" id="btn-mic" title="マイク">🎤</button>
    <button class="ctl" id="btn-cam" title="カメラ">🎥</button>
    <button class="ctl" id="btn-screen" title="画面共有">🖥️</button>
    <button class="ctl" id="btn-chat" title="チャット">💬<span class="badge" id="chat-badge" hidden></span></button>
    <button class="ctl" id="btn-transcript" title="文字起こし" hidden>📝</button>
    <button class="ctl leave" id="btn-leave" title="退出">📴</button>
  </div>

  <div class="chat" id="chat" hidden>
    <div class="chat-head"><span id="chat-title">チャット</span><button id="chat-close">✕</button></div>
    <div class="chat-log" id="chat-log"></div>
    <form class="chat-form" id="chat-form">
      <input id="chat-input" autocomplete="off" maxlength="500" placeholder="メッセージ…">
      <button type="submit">送信</button>
    </form>
  </div>

  <script>
  (function () {
    const room = (location.pathname.split('/').filter(Boolean).pop() || '').slice(0, 64);

    // ── i18n (global-first: English unless the browser/?lang= says Japanese) ──
    const STR = {
      ja: {
        title: 'オンライン会議室 — 濱田優貴', app: '濱田優貴 ミーティング',
        connecting: '接続中…', waiting: '参加者を待っています',
        inCall: n => '通話中 · ' + n + '人', you: 'あなた', guest: '参加者',
        waitText: 'このページを開いたままお待ちください。同じURLを開いた人が、自動的に会議に加わります。（最大6人）',
        copy: '招待リンクをコピー', copied: 'コピーしました ✓',
        noMediaTitle: 'カメラ / マイクを使えません',
        noMediaText: 'ブラウザの権限を許可してから再読み込みしてください。',
        permError: '権限エラー', disconnected: '切断されました',
        endedTitle: '通話を終了しました', endedText: 'ご参加ありがとうございました。',
        rebook: '日程をもう一度選ぶ', ended: '終了', toFire: '🔥 焚き火に戻る',
        notFoundTitle: '会議室が見つかりません', notFoundText: 'リンクをもう一度ご確認ください。',
        mic: 'マイク', cam: 'カメラ', leave: '退出',
        screen: '画面共有', chat: 'チャット', msgPh: 'メッセージ…', send: '送信', namePrompt: '名前を入力してください',
        trOn: '📝 文字起こしON（自分の声のみ・タップでOFF）', trOff: '📝 文字起こしOFF（タップでON）',
      },
      en: {
        title: 'Video room — Yuki Hamada', app: 'Yuki Hamada · Meeting',
        connecting: 'Connecting…', waiting: 'Waiting for others to join',
        inCall: n => 'In call · ' + n, you: 'You', guest: 'Guest',
        waitText: 'Keep this page open. Anyone who opens the same link joins automatically (up to 6).',
        copy: 'Copy invite link', copied: 'Copied ✓',
        noMediaTitle: 'Camera / microphone unavailable',
        noMediaText: 'Allow access in your browser, then reload the page.',
        permError: 'Permission error', disconnected: 'Disconnected',
        endedTitle: 'Call ended', endedText: 'Thanks for joining.',
        rebook: 'Pick another time', ended: 'Ended', toFire: '🔥 Back to the campfire',
        notFoundTitle: 'Room not found', notFoundText: 'Please check the link and try again.',
        mic: 'Microphone', cam: 'Camera', leave: 'Leave',
        screen: 'Share screen', chat: 'Chat', msgPh: 'Message…', send: 'Send', namePrompt: 'Enter your name',
        trOn: '📝 Transcript ON (your own voice only · tap to turn off)', trOff: '📝 Transcript OFF (tap to turn on)',
      },
    };
    const qLang = new URLSearchParams(location.search).get('lang');
    const lang = (qLang === 'ja' || qLang === 'en') ? qLang
      : ((navigator.language || 'en').toLowerCase().startsWith('ja') ? 'ja' : 'en');
    const T = STR[lang];
    function applyI18n() {
      document.documentElement.lang = lang;
      document.title = T.title;
      document.getElementById('status').textContent = T.connecting;
      document.querySelector('header h1').textContent = T.app;
      document.querySelector('#tile-me .name').textContent = T.you;
      document.getElementById('ov-title').textContent = T.waiting;
      document.getElementById('ov-text').textContent = T.waitText;
      document.getElementById('copy-link').textContent = T.copy;
      document.getElementById('btn-mic').title = T.mic;
      document.getElementById('btn-cam').title = T.cam;
      document.getElementById('btn-leave').title = T.leave;
      document.getElementById('btn-screen').title = T.screen;
      document.getElementById('btn-chat').title = T.chat;
      document.getElementById('chat-title').textContent = T.chat;
      document.getElementById('chat-input').placeholder = T.msgPh;
      document.querySelector('#chat-form button').textContent = T.send;
      // ともしび focus room: offer a way back to the campfire so the worlds stay connected.
      const tf = document.getElementById('to-fire');
      if (tf) { tf.textContent = T.toFire; if (room === 'tomoshibi') tf.hidden = false; }
    }
    applyI18n();
    // ICE servers (STUN + optional TURN) come from the server so TURN credentials
    // aren't baked into the page. Falls back to public STUN if the fetch fails.
    let ICE = { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
    ] };
    async function loadIce() {
      try {
        const r = await fetch('/api/room/ice', { cache: 'no-store' });
        if (r.ok) { const j = await r.json(); if (j && j.iceServers) ICE = j; }
      } catch (_) {}
    }

    const grid = document.getElementById('grid');
    const localV = document.getElementById('local');
    const meTile = document.getElementById('tile-me');
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');

    let myId = null, ws = null, localStream = null;
    let camVideoTrack = null, shareTrack = null, sharing = false;
    const peers = new Map(); // peerId -> { pc, tile, video }
    const peerNames = new Map(); // peerId -> display name
    let myName = (new URLSearchParams(location.search).get('name') || localStorage.getItem('rtcName') || '').slice(0, 40);
    if (myName) localStorage.setItem('rtcName', myName);
    function sendProfile() { if (myName) send({ t: 'profile', name: myName }); }
    function setTileName(tile, name) { const el = tile.querySelector('.name'); if (el) el.textContent = name; }
    if (myName) setTileName(meTile, myName);

    function remoteCount() { return peers.size; }

    function relayout() {
      const n = remoteCount() + 1; // +1 = me
      grid.className = 'grid n' + Math.min(n, 6);
      meTile.classList.toggle('solo', n === 1);
      peers.forEach(p => p.tile.classList.toggle('solo', false));
      if (n > 1) overlay.hidden = true; else overlay.hidden = false;
      statusEl.textContent = n > 1 ? T.inCall(n) : T.waiting;
    }

    function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

    document.getElementById('copy-link').onclick = async () => {
      try { await navigator.clipboard.writeText(location.href);
        document.getElementById('copy-link').textContent = T.copied;
      } catch (_) {}
    };

    function addTile(peerId) {
      const tile = document.createElement('div');
      tile.className = 'tile connecting';
      tile.id = 'tile-' + peerId;
      const v = document.createElement('video');
      v.autoplay = true; v.playsInline = true;
      const tag = document.createElement('span');
      tag.className = 'name'; tag.textContent = peerNames.get(peerId) || T.guest;
      tile.appendChild(v); tile.appendChild(tag);
      grid.appendChild(tile);
      return { tile, video: v };
    }

    function getPeer(peerId) {
      let p = peers.get(peerId);
      if (p) return p;
      const { tile, video } = addTile(peerId);
      const pc = new RTCPeerConnection(ICE);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      // a newcomer joining mid-share should see the screen, not the camera
      if (sharing && shareTrack) {
        const s = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        if (s) s.replaceTrack(shareTrack).catch(() => {});
      }
      pc.ontrack = (e) => {
        video.srcObject = e.streams[0];
        tile.classList.remove('connecting');
      };
      pc.onicecandidate = (e) => { if (e.candidate) send({ t: 'candidate', to: peerId, candidate: e.candidate }); };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'failed' || pc.connectionState === 'closed') removePeer(peerId);
      };
      p = { pc, tile, video };
      peers.set(peerId, p);
      relayout();
      return p;
    }

    function removePeer(peerId) {
      const p = peers.get(peerId);
      if (!p) return;
      try { p.pc.close(); } catch (_) {}
      try { p.tile.remove(); } catch (_) {}
      peers.delete(peerId);
      relayout();
    }

    async function init() {
      await loadIce();
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      } catch (err) {
        overlay.hidden = false;
        document.getElementById('ov-title').textContent = T.noMediaTitle;
        document.getElementById('ov-text').textContent = T.noMediaText;
        statusEl.textContent = T.permError;
        return;
      }
      localV.srcObject = localStream;
      camVideoTrack = localStream.getVideoTracks()[0] || null;
      if (myName) setTileName(meTile, myName);
      trStart();

      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/room/${room}`);
      ws.onopen = () => { relayout(); sendProfile(); };
      ws.onclose = () => { if (remoteCount() === 0) statusEl.textContent = T.disconnected; };

      ws.onmessage = async (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch (_) { return; }

        if (m.t === 'hello') { myId = m.id; return; }

        // chat & profile are broadcast (no `to`) — handle before the directed guard
        if (m.t === 'chat') {
          addMsg(m.name || T.guest, String(m.text || '').slice(0, 500), false);
          if (!chatOpen) { unread++; updateBadge(); }
          return;
        }
        if (m.t === 'profile') {
          if (m.from != null && m.name) {
            const nm = String(m.name).slice(0, 40);
            peerNames.set(m.from, nm);
            const p = peers.get(m.from);
            if (p) setTileName(p.tile, nm);
          }
          return;
        }
        if (m.t === 'screen') {
          const p = peers.get(m.from);
          if (p) p.tile.classList.toggle('screen', !!m.on);
          return;
        }

        if (m.t === 'join') {
          // Let the newcomer learn our name and current screen-share state.
          sendProfile();
          if (sharing) send({ t: 'screen', on: true });
          // For each pair, the LOWER peer id initiates the offer (avoids glare).
          // Existing peers (lower id) offer to the newcomer (higher id).
          if (myId != null && myId < m.from) {
            const p = getPeer(m.from);
            const offer = await p.pc.createOffer();
            await p.pc.setLocalDescription(offer);
            send({ t: 'offer', to: m.from, sdp: p.pc.localDescription });
          }
          return;
        }

        // All directed messages below must be addressed to me.
        if (m.to != null && m.to !== myId) return;

        if (m.t === 'offer') {
          const p = getPeer(m.from);
          await p.pc.setRemoteDescription(m.sdp);
          const ans = await p.pc.createAnswer();
          await p.pc.setLocalDescription(ans);
          send({ t: 'answer', to: m.from, sdp: p.pc.localDescription });
          return;
        }
        if (m.t === 'answer') {
          const p = peers.get(m.from);
          if (p) await p.pc.setRemoteDescription(m.sdp);
          return;
        }
        if (m.t === 'candidate') {
          const p = peers.get(m.from);
          if (p && m.candidate) { try { await p.pc.addIceCandidate(m.candidate); } catch (_) {} }
          return;
        }
        if (m.t === 'leave') { removePeer(m.from); return; }
      };
    }

    // ── Controls (tracks are shared, so toggling enabled affects every peer) ──
    document.getElementById('btn-mic').onclick = function () {
      if (!localStream) return;
      const on = localStream.getAudioTracks().some(t => (t.enabled = !t.enabled));
      this.classList.toggle('off', !on); this.textContent = on ? '🎤' : '🔇';
    };
    document.getElementById('btn-cam').onclick = function () {
      if (!localStream) return;
      const on = localStream.getVideoTracks().some(t => (t.enabled = !t.enabled));
      this.classList.toggle('off', !on); this.textContent = on ? '🎥' : '🚫';
    };

    // ── 文字起こし (own voice only) ────────────────────────────────────
    // Audio stays peer-to-peer and never reaches the server; each participant's
    // browser transcribes its OWN mic locally (Web Speech API) and posts text
    // lines to /api/room/<id>/transcript. The 📝 button is always visible while
    // active so everyone knows, and tapping it turns it off. Read access to the
    // log is admin-only. Hidden entirely when the browser has no SpeechRecognition.
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const trBtn = document.getElementById('btn-transcript');
    let trOn = localStorage.getItem('rtcTranscript') !== 'off';
    let trRec = null, trActive = false;
    function micLive() { return !!(localStream && localStream.getAudioTracks().some(t => t.enabled)); }
    function trBadge() {
      trBtn.hidden = !SR;
      trBtn.classList.toggle('off', !trOn);
      trBtn.title = trOn ? T.trOn : T.trOff;
      trBtn.textContent = trOn ? '📝' : '🚫';
    }
    function trPost(text) {
      if (!text) return;
      fetch(`/api/room/${room}/transcript`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: myName || '', text }), keepalive: true,
      }).catch(() => {});
    }
    function trStart() {
      if (!SR || !trOn || trActive || !localStream) return;
      trRec = new SR();
      trRec.lang = lang === 'ja' ? 'ja-JP' : (navigator.language || 'en-US');
      trRec.continuous = true; trRec.interimResults = false;
      trRec.onresult = (e) => {
        if (!trOn || !micLive()) return; // muted mic ⇒ drop (privacy follows the 🎤 button)
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) trPost(e.results[i][0].transcript.trim());
        }
      };
      // Chrome stops recognition every ~60s of silence — restart while ON.
      trRec.onend = () => { trActive = false; if (trOn) setTimeout(trStart, 800); };
      trRec.onerror = () => {};
      try { trRec.start(); trActive = true; } catch (_) {}
    }
    function trStop() { if (trRec) { try { trRec.stop(); } catch (_) {} } trActive = false; }
    trBtn.onclick = function () {
      trOn = !trOn;
      localStorage.setItem('rtcTranscript', trOn ? 'on' : 'off');
      trBadge();
      if (trOn) trStart(); else trStop();
    };
    trBadge();
    document.getElementById('btn-leave').onclick = function () {
      try { send({ t: 'leave' }); } catch (_) {}
      trOn = false; trStop();
      peers.forEach(p => { try { p.pc.close(); } catch (_) {} });
      if (ws) ws.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      const backHref = room === 'tomoshibi' ? '/community' : '/meet';
      const backLabel = room === 'tomoshibi' ? T.toFire : T.rebook;
      document.getElementById('stage').innerHTML =
        '<div class="ended"><div class="moon-big" style="margin:0 auto 18px"></div>' +
        '<h2>' + T.endedTitle + '</h2><p style="color:var(--muted)">' +
        T.endedText + '<br><a href="' + backHref + '">' + backLabel + '</a></p></div>';
      document.getElementById('controls').style.display = 'none';
      statusEl.textContent = T.ended;
    };

    // ── Screen share (replaceTrack on every peer; revert to camera on stop) ──
    function replaceVideoForAll(track) {
      peers.forEach(p => {
        const s = p.pc.getSenders().find(s => s.track && s.track.kind === 'video');
        if (s && track) s.replaceTrack(track).catch(() => {});
      });
    }
    function stopShare() {
      if (!sharing) return;
      sharing = false;
      try { if (shareTrack) shareTrack.stop(); } catch (_) {}
      shareTrack = null;
      replaceVideoForAll(camVideoTrack);
      localV.srcObject = localStream;
      meTile.classList.remove('screen');
      document.getElementById('btn-screen').classList.remove('off');
      send({ t: 'screen', on: false });
    }
    document.getElementById('btn-screen').onclick = async function () {
      if (sharing) { stopShare(); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return;
      try {
        const ds = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        shareTrack = ds.getVideoTracks()[0];
        if (!shareTrack) return;
        sharing = true;
        replaceVideoForAll(shareTrack);
        localV.srcObject = ds;
        meTile.classList.add('screen');
        this.classList.add('off');
        shareTrack.onended = stopShare; // browser "Stop sharing" bar
        send({ t: 'screen', on: true });
      } catch (_) { /* user cancelled */ }
    };

    // ── Chat ──
    const chatPanel = document.getElementById('chat');
    const chatLog = document.getElementById('chat-log');
    const chatInput = document.getElementById('chat-input');
    let chatOpen = false, unread = 0;
    function updateBadge() {
      const b = document.getElementById('chat-badge');
      if (unread > 0) { b.hidden = false; b.textContent = unread > 9 ? '9+' : unread; }
      else b.hidden = true;
    }
    function addMsg(name, text, me) {
      const d = document.createElement('div');
      d.className = 'msg' + (me ? ' me' : '');
      const who = document.createElement('span'); who.className = 'who'; who.textContent = name;
      const body = document.createElement('span'); body.className = 'body'; body.textContent = ' ' + text;
      d.appendChild(who); d.appendChild(body);
      chatLog.appendChild(d); chatLog.scrollTop = chatLog.scrollHeight;
    }
    document.getElementById('btn-chat').onclick = function () {
      chatOpen = !chatOpen; chatPanel.hidden = !chatOpen;
      if (chatOpen) { unread = 0; updateBadge(); chatInput.focus(); }
    };
    document.getElementById('chat-close').onclick = function () { chatOpen = false; chatPanel.hidden = true; };
    document.getElementById('chat-form').onsubmit = function (e) {
      e.preventDefault();
      const t = chatInput.value.trim(); if (!t) return;
      send({ t: 'chat', name: myName || T.you, text: t });
      addMsg(myName || T.you, t, true);
      chatInput.value = '';
    };

    if (!room) {
      overlay.hidden = false;
      document.getElementById('ov-title').textContent = T.notFoundTitle;
      document.getElementById('ov-text').textContent = T.notFoundText;
    } else { init(); }
  })();
  </script>
</body>
</html>
