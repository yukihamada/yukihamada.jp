name: Deploy to Fly.io

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --strategy immediate: 既存マシンを入れ替え（新マシンを作らない）。
      # org のマシン上限でローリング(緑machine作成)が弾かれるため。
      - run: flyctl deploy --remote-only -a yukihamada-jp --strategy immediate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A: 仕事の鼓動を薪に — デプロイ成功でともしびに deploy薪を自動投下。
      # 火を無人でも生かす。失敗してもデプロイは壊さない（continue-on-error）。
      - name: Light the campfire (ともしび)
        if: success()
        continue-on-error: true
        env:
          TOMOSHIBI_SECRET: ${{ secrets.COMMUNITY_WEBHOOK_SECRET }}
        run: |
          [ -z "$TOMOSHIBI_SECRET" ] && exit 0
          curl -s -m 15 -X POST https://yukihamada.jp/api/community/webhook \
            -H "Content-Type: application/json" \
            -H "X-Tomoshibi-Secret: $TOMOSHIBI_SECRET" \
            -d "{\"text\":\"yukihamada.jp を本番デプロイ（${GITHUB_SHA:0:7}）\",\"kind\":\"deploy\",\"author\":\"GitHub Actions\",\"url\":\"https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}\"}" || true
